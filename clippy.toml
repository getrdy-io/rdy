# unwrap_used and expect_used are denied in [workspace.lints.clippy].
# These two settings allow them inside `#[test]` functions and `#[cfg(test)]` modules only.
# Helper functions in tests/ files are not covered, so they must not use unwrap or expect.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# clap exits the process with code 2 on a usage error, and in rdy 2 means NOT READY (ADR 0008,
# 07 section 1). Every parse goes through `try_get_matches_from`, and `rdy_cli::run` maps the error
# to 64. These methods print the error and exit on their own.
disallowed-methods = [
    { path = "clap::Parser::parse", reason = "exits 2 on a usage error; use try_parse_from and map the error (rdy_cli::run)" },
    { path = "clap::Parser::parse_from", reason = "exits 2 on a usage error; use try_parse_from and map the error (rdy_cli::run)" },
    { path = "clap::Command::get_matches", reason = "exits 2 on a usage error; use try_get_matches_from and map the error (rdy_cli::run)" },
    { path = "clap::Command::get_matches_from", reason = "exits 2 on a usage error; use try_get_matches_from and map the error (rdy_cli::run)" },
    { path = "clap::Command::get_matches_mut", reason = "exits 2 on a usage error; use try_get_matches_from and map the error (rdy_cli::run)" },
    { path = "clap::Parser::update_from", reason = "exits 2 on a usage error; use try_update_from and map the error (rdy_cli::run)" },
    { path = "clap::error::Error::print", reason = "prints clap's own text, which can echo what was typed; render the error with rdy_cli::error::emit" },
    { path = "clap::error::Error::exit", reason = "exits 2; print the error with rdy_cli::error::emit and return exit code 64" },
    # The CLI must read the real clock. `load_at` exists for tests that pin "now", and a caller of it could
    # defeat spec expiry. Tests allow it with `#[allow(clippy::disallowed_methods)]`. The path
    # `rdy_spec::loaded::load_at` is the same item and clippy matches the item, so one entry covers both
    # (M1-044 removed the second one: two entries for one item report under one name only).
    { path = "rdy_spec::load_at", reason = "only tests may pass a clock; use rdy_spec::load" },
    # A check reaches the machine only through its `Probe` (ADR 0014, SEC-17). `table::run` validates a
    # command against the command table but writes no action-log entry and checks no `CheckInfo`
    # declaration. Only the live probe backend may call it, with `#[expect(clippy::disallowed_methods)]`.
    # `exec::run` and `ExecSpec::new` skip the table and the policy as well; only the policy and tests
    # may use them.
    { path = "rdy_engine::exec::table::run", reason = "a check runs a command only through Probe::exec, which logs it and applies the check's declaration", allow-invalid = true },
    { path = "rdy_engine::exec::run", reason = "the raw runner skips the command table and the policy; use Probe::exec", allow-invalid = true },
    { path = "rdy_engine::exec::ExecSpec::new", reason = "the raw runner skips the command table and the policy; use Probe::exec", allow-invalid = true },
    # The live backend reads the real machine. A check gets its backend from the probe it is handed, and
    # only the engine and the CLI make one (ADR 0014 decision 3). The CLI calls it once, in
    # `rdy_cli::entry`, and opts out there with `#[expect(clippy::disallowed_methods)]` (INV-07,
    # M1-074); so do the engine's own tests.
    { path = "rdy_engine::live_backend", reason = "a check never builds a backend; it uses the Probe it is handed (ADR 0014)", allow-invalid = true },
    # `dangerous()` is how rustls takes a certificate verifier that accepts what it should refuse. Only
    # the recording verifier of the TLS facade (`probe/net/tls/record.rs`, `recording_client`) uses it, with
    # `#[expect(clippy::disallowed_methods)]` (M1-092, SEC-133-2). The HTTP probe verifies strictly.
    { path = "rustls::ConfigBuilder::dangerous", reason = "builds a client that can skip certificate checks; only probe/net/tls/record.rs may, with #[expect]", allow-invalid = true },
    { path = "rustls::client::ClientConfig::dangerous", reason = "swaps the certificate verifier of a built client; only probe/net/tls/record.rs may, with #[expect]", allow-invalid = true },
    { path = "rdy_engine::probe::Probe::kube_call", reason = "writes the kube entry of the action log; only the read-only guard in rdy-checks-k8s src/client/ calls it, so a check cannot forge a kube entry (INV-14)", allow-invalid = true },
    # The functions behind the `safe`, `escape` and `e` filters. `escape("none")` turns escaping off (M1-078).
    { path = "askama::filters::safe", reason = "prints a value without escaping it", allow-invalid = true },
    { path = "askama::filters::escape", reason = "takes an escaper name, and \"none\" turns escaping off", allow-invalid = true },
    { path = "askama::filters::e", reason = "takes an escaper name, and \"none\" turns escaping off", allow-invalid = true },
]

# askama escapes every value in an `.html` template. These items print a value without escaping it, or mark
# a type as needing none. What clippy catches: a single-name `use` of one of the types, the type in any type
# position, a trait bound, and a call of the lowercase `safe`, `escape` and `e` functions. What it does not:
# a glob import (`use askama::filters::*`), a tuple-struct constructor such as `Safe(x)`, and the trait in an
# `impl Trait for Type` header. `scripts/check-html-escapes.sh` covers those: it fails on the word
# `filters`, `Safe` or `Unsafe` in any Rust file that names askama, and on `::` inside a template tag. The
# one marker impl, on `EmbeddedJson` in `rdy-engine`'s `report/html/view.rs`, is the one line it allows
# (M1-078, SEC-64). `allow-invalid` keeps an askama bump that moves an item from breaking a crate that
# does not use askama.
disallowed-types = [
    { path = "askama::filters::Safe", reason = "prints a value without escaping; only the EmbeddedJson marker in report/html/view.rs may switch escaping off", allow-invalid = true },
    { path = "askama::filters::Unsafe", reason = "wraps a value for the escaper; use askama's default escaping", allow-invalid = true },
    { path = "askama::filters::MaybeSafe", reason = "marks filter output as maybe unescaped; escaping stays on", allow-invalid = true },
    { path = "askama::filters::HtmlSafe", reason = "marks a type as printed without escaping; only EmbeddedJson in report/html/view.rs may impl it (held by scripts/check-html-escapes.sh)", allow-invalid = true },
    { path = "askama::filters::HtmlSafeOutput", reason = "marks filter output as HTML safe; escaping stays on", allow-invalid = true },
]
