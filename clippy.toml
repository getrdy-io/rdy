# unwrap_used and expect_used are denied in [workspace.lints.clippy].
# These two settings allow them inside `#[test]` functions and `#[cfg(test)]` modules only.
# Helper functions in tests/ files are not covered, so they must not use unwrap or expect.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# clap exits the process with code 2 on a usage error, and in rdy 2 means NOT READY (ADR 0008,
# 07 section 1). Every parse goes through `try_get_matches_from`, and `rdy_cli::run` maps the error
# to 64. These methods print the error and exit on their own.
disallowed-methods = [
    { path = "clap::Parser::parse", reason = "exits 2 on a usage error; use try_parse_from and map the error (rdy_cli::run)" },
    { path = "clap::Parser::parse_from", reason = "exits 2 on a usage error; use try_parse_from and map the error (rdy_cli::run)" },
    { path = "clap::Command::get_matches", reason = "exits 2 on a usage error; use try_get_matches_from and map the error (rdy_cli::run)" },
    { path = "clap::Command::get_matches_from", reason = "exits 2 on a usage error; use try_get_matches_from and map the error (rdy_cli::run)" },
    { path = "clap::Command::get_matches_mut", reason = "exits 2 on a usage error; use try_get_matches_from and map the error (rdy_cli::run)" },
    { path = "clap::Parser::update_from", reason = "exits 2 on a usage error; use try_update_from and map the error (rdy_cli::run)" },
    { path = "clap::error::Error::print", reason = "prints clap's own text, which can echo what was typed; render the error with rdy_cli::error::emit" },
    { path = "clap::error::Error::exit", reason = "exits 2; print the error with rdy_cli::error::emit and return exit code 64" },
    # The CLI must read the real clock. `load_at` exists for tests that pin "now", and a caller of it could
    # defeat spec expiry. Tests allow it with `#[allow(clippy::disallowed_methods)]`. The path
    # `rdy_spec::loaded::load_at` is the same item and clippy matches the item, so one entry covers both
    # (M1-044 removed the second one: two entries for one item report under one name only).
    { path = "rdy_spec::load_at", reason = "only tests may pass a clock; use rdy_spec::load" },
    # A check reaches the machine only through its `Probe` (ADR 0014, SEC-17). `table::run` validates a
    # command against the command table but writes no action-log entry and checks no `CheckInfo`
    # declaration. Only the live probe backend may call it, with `#[expect(clippy::disallowed_methods)]`.
    # `exec::run` and `ExecSpec::new` skip the table and the policy as well; only the policy and tests
    # may use them.
    { path = "rdy_engine::exec::table::run", reason = "a check runs a command only through Probe::exec, which logs it and applies the check's declaration", allow-invalid = true },
    { path = "rdy_engine::exec::run", reason = "the raw runner skips the command table and the policy; use Probe::exec", allow-invalid = true },
    { path = "rdy_engine::exec::ExecSpec::new", reason = "the raw runner skips the command table and the policy; use Probe::exec", allow-invalid = true },
]
