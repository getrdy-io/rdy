# Steps dist inserts into every build-local-artifacts job, before the build (github-build-setup in
# dist-workspace.toml). docs/plan/06-release-and-distribution.md describes the release design.
#
# - The pinned toolchain comes from rust-toolchain.toml. Name no version here.
# - Do not set RUSTFLAGS anywhere. dist sets the static-linking flags it needs, and a RUSTFLAGS
#   variable would replace flags from .cargo/config.toml.
# - dist installs musl-tools on the Linux runners itself.
- name: Install the pinned toolchain and the target
  shell: bash
  env:
    TARGETS: ${{ join(matrix.targets, ' ') }}
  run: |
    rustup toolchain install --no-self-update
    for target in $TARGETS; do
      rustup target add "$target"
    done
- name: Point C code at musl-gcc
  if: runner.os == 'Linux'
  shell: bash
  env:
    TARGETS: ${{ join(matrix.targets, ' ') }}
  run: |
    # C code in a dependency (ring, later) builds with musl's compiler. Set CC only. Never set the
    # linker to musl-gcc: its wrappers do not handle static-pie (scripts/musl-pie-linker.sh).
    for target in $TARGETS; do
      echo "CC_${target//-/_}=musl-gcc" >> "$GITHUB_ENV"
    done
