# zizmor policy (SEC-01, SEC-03). Run by the zizmor job in ci.yml.
rules:
  unpinned-uses:
    config:
      policies:
        # Every action, from any owner, must be pinned to a full commit SHA.
        "*": hash-pin

  # release.yml is generated by dist 0.33.0 and is never edited by hand (ADR 0019). dist writes the
  # five patterns below and has no setting for them. Each ignore names the file, not the rule
  # everywhere, so ci.yml and the other workflows stay fully checked. Every other rule, including
  # unpinned-uses, still applies to release.yml. Remove an ignore when dist stops writing the pattern
  # or when the release workflow is hand-written (06, "dist" section, fallback).
  excessive-permissions:
    # dist sets `contents: write` for the whole workflow. Only the host and announce jobs need it.
    # M1-010 (sign-release) must narrow it, see ADR 0019.
    ignore:
      - release.yml
  template-injection:
    # dist puts its own computed values (the tag, the build matrix, its install commands) into run
    # steps. The tag is the only value an outsider could shape. Only admins create v* tags (ruleset,
    # M1-011), and dist's tag pattern also matches other names, so that ruleset is the control.
    ignore:
      - release.yml
  unpinned-images:
    # `container:` is a matrix expression. None of our five targets sets a container.
    ignore:
      - release.yml
  secrets-inherit:
    # dist passes `secrets: inherit` to custom jobs. check-release-artifacts.yml reads no secret.
    ignore:
      - release.yml
  self-repository:
    # A style note on dist's `uses: ./.github/workflows/<job>.yml` call.
    ignore:
      - release.yml
