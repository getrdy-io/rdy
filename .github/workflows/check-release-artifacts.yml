# Runs scripts/check-release-artifacts.sh on the artifacts dist built, before the GitHub Release is
# created (M1-007). release.yml calls it as a publish job (publish-jobs in dist-workspace.toml), not
# a host job: only a failed publish job stops the announce job (ADR 0020, decision 3). It fails the
# release if an unexpected file, an archive, a checksum, the static-pie proof (ADR 0006), the
# cargo-auditable data, the Windows imports or the SBOM is wrong.
#
# It never runs on its own: release.yml is generated by dist and calls it. Edit the name here
# only together with publish-jobs in dist-workspace.toml.

name: check-release-artifacts

on:
  workflow_call:
    inputs:
      plan:
        description: "dist's plan, passed by release.yml. Not used."
        required: true
        type: string

permissions: {}

jobs:
  # A catalog entry whose vendor page nobody read in 180 days stops the release (03 Appendix B, M1-173).
  # It runs here and not in ci.yml: in a pull request workflow every pull request would turn red on
  # day 181. The date is the day of this run, in UTC. It is its own job because it builds xtask from
  # cold, which does not belong in the 15 minutes of the artifact checker. Both jobs belong to this
  # reusable workflow, so release.yml's `custom-check-release-artifacts` fails if either fails, and
  # sign-release waits for that job. The `--today` line is pinned by tests/lint-wall (no `--max-days`).
  agents-stale:
    name: security-agent catalog is fresh
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - name: Check the security-agent catalog is fresh
        run: cargo run --locked --quiet --package xtask -- agents-stale --today "$(date -u +%F)"

  check:
    name: check release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The checker is the one in the tagged source. The pinned toolchain gives `cargo`.
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - name: Install cargo-audit
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      # The same artifacts the release will upload: dist's archives, checksums and the SBOM.
      - name: Fetch the built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Check the release artifacts
        run: scripts/check-release-artifacts.sh target/distrib
