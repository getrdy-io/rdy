# Runs scripts/check-release-artifacts.sh on the artifacts dist built, before the GitHub Release is
# created (M1-007). release.yml calls it in the host phase (host-jobs in dist-workspace.toml). It
# fails the release if an archive, a checksum, the static-pie proof (ADR 0006), the
# cargo-auditable data, the Windows imports or the SBOM is wrong.
#
# It never runs on its own: release.yml is generated by dist and calls it. Edit the name here
# only together with host-jobs in dist-workspace.toml.

name: check-release-artifacts

on:
  workflow_call:
    inputs:
      plan:
        description: "dist's plan, passed by release.yml. Not used."
        required: true
        type: string

permissions: {}

jobs:
  check:
    name: check release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The checker is the one in the tagged source. The pinned toolchain gives `cargo`.
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - name: Install cargo-audit
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-audit@0.22.2
      # The same artifacts the release will upload: dist's archives, checksums and the SBOM.
      - name: Fetch the built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Check the release artifacts
        run: scripts/check-release-artifacts.sh target/distrib
