# The live Kubernetes tests: the ignored tests of crates/rdy-checks-k8s/tests/live_cluster.rs against a real API
# server, on the oldest and newest supported minors (M1-108, ADR 0039). docs/plan/03 ("Fixtures for all of
# them") and 08 (section 6) describe the design.
#
# This workflow is not in ci-ok's `needs:` (docs/plan/06 lists no kind job among the gates). It depends on Docker Hub
# and on an upstream image, and an outage of either must not block every merge. It runs on every PR and on
# main, so a red result is visible, and nightly, so a drift upstream shows within a day. Making it a gate is a
# decision for the founder: move the job into ci.yml and add it to the `needs:` of `ci-ok` (ADR 0039).
#
# Same rules as ci.yml: every `uses:` is pinned to a full commit SHA, the token is read-only, no
# pull_request_target, and the Rust toolchain comes from rust-toolchain.toml. The kind binary and both node
# images are pinned by digest below. Dependabot does not read these lines. Bump them by hand, and the matrix
# when Kubernetes ships a minor (ADR 0039 says how).

name: kind

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: kind-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_NET_RETRY: "3"
  RUST_BACKTRACE: "1"

jobs:
  kind:
    name: kind (${{ matrix.minor }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      # One red minor must not hide the other.
      fail-fast: false
      matrix:
        include:
          # kind v0.33.0 (2026-08-26) ships these images. The digests are the multi-arch index digests,
          # read from the release notes and checked against Docker Hub on 2026-10-30.
          # 1.35 is the oldest minor Kubernetes still patches. 1.34 reached end of life on 2026-10-27.
          - minor: "1.35"
            image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          - minor: "1.37"
            image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    env:
      KIND_VERSION: v0.33.0
      # sha256 of kind-linux-amd64 of v0.33.0. It equals the release's kind-linux-amd64.sha256sum.
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      NODE_IMAGE: ${{ matrix.image }}
      # Linux tests run against the musl target, so CI tests what ships (docs/plan/06). Same as ci.yml: the
      # target goes on the cargo command line (`--target`), and CC is set in the musl-tools step. The lint
      # wall allows no build-target variable of Cargo here (tests/lint-wall/tests/wall_intact.rs).
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner has an older kind. This one is the pinned file, with its hash checked before it runs.
      - name: Install kind (pinned file, sha256 checked)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --max-time 120 -o "$RUNNER_TEMP/kind-download" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  $RUNNER_TEMP/kind-download" | sha256sum -c -
          # No sudo and no change to PATH (the lint wall bans a write to the path file): the file goes to
          # the runner temp and the next steps call it by that path.
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$RUNNER_TEMP/kind-download" "$RUNNER_TEMP/bin/kind"
          "$RUNNER_TEMP/bin/kind" version
          "$RUNNER_TEMP/bin/kind" version | grep -F "kind ${KIND_VERSION} "
      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          # C code in a dependency builds with musl's compiler. Set CC only.
          # Never set the linker to musl-gcc: its wrappers do not handle static-pie (ADR 0006).
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Install the pinned toolchain and the musl target
        run: |
          rustup toolchain install --no-self-update
          rustup target add "$TARGET"
      # PRs read the cache that main saved. Only main writes it, and only the leg that makes the same
      # build as the other, so two legs do not race to save one key.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: kind
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.minor == '1.37' }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@0.9.149
          # A missing prebuilt binary fails the step. It never falls back to `cargo install`.
          fallback: none
      # Build before the cluster starts, so a compile error shows without waiting for an image pull. The
      # same command runs the tests later, so nothing is built twice.
      - name: Build the live tests
        run: cargo nextest run --locked --target "$TARGET" -p rdy-checks-k8s --test live_cluster --run-ignored only --no-run
      - name: Create the kind cluster
        run: |
          "$RUNNER_TEMP/bin/kind" create cluster --name rdy-live --image "$NODE_IMAGE" \
            --kubeconfig "$RUNNER_TEMP/admin.kubeconfig" --wait 180s
          # kubectl from the node image: the client then matches the server exactly, and it needs no
          # download of its own.
          docker cp rdy-live-control-plane:/usr/bin/kubectl "$RUNNER_TEMP/kubectl"
          "$RUNNER_TEMP/kubectl" version --client
      - name: Live tests (restricted namespace, read-only role, k8s.version, reviews)
        env:
          KUBECONFIG: ${{ runner.temp }}/admin.kubeconfig
          KUBECTL: ${{ runner.temp }}/kubectl
          RDY_LIVE_EXPECT_MINOR: ${{ matrix.minor }}
          RDY_LIVE_TARGET: ${{ env.TARGET }}
        run: scripts/kind-live-test.sh
      # Text only, and only when something failed. No artifact upload and no token needed.
      - name: Cluster state after a failure
        if: failure()
        env:
          KUBECONFIG: ${{ runner.temp }}/admin.kubeconfig
        run: |
          "$RUNNER_TEMP/kubectl" get nodes -o wide || true
          "$RUNNER_TEMP/kubectl" get pods --all-namespaces || true
          "$RUNNER_TEMP/kubectl" get events --all-namespaces --sort-by=.lastTimestamp | tail -40 || true
