# CI for rdy. docs/plan/06-release-and-distribution.md describes the design.
#
# Rules for this file (SEC-01, SEC-03):
# - Every `uses:` line is pinned to a full commit SHA with the version in a comment. The zizmor job
#   enforces it (.github/zizmor.yml, unpinned-uses with hash-pin for every owner), and Dependabot
#   keeps the pins current (.github/dependabot.yml).
# - The token is read-only. Each job names the permissions it needs.
# - No pull_request_target. Fork PRs get a read-only token.
# - `ci-ok` is the only required check. It lists every gating job in `needs:`.
#   Add each new gating job there. A matrix job is one entry: it is green only when every leg is.
# - No path filters. A path-filtered required check goes pending and blocks merges.
# - The Rust toolchain comes from rust-toolchain.toml. Do not name a version here.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_NET_RETRY: "3"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      # PRs read the cache that main saved. Only main writes it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      # The workspace build turns `runtime` on through the other crates. A probe gate without a runtime
      # (replay) builds rdy-engine alone, so lint and document that build too (ADR 0028).
      - name: cargo clippy rdy-engine without default features
        run: cargo clippy --locked -p rdy-engine --no-default-features --all-targets -- -D warnings
      # The replay backend is behind `testing`, so the probe gate without a runtime needs this build too.
      - name: cargo clippy rdy-engine without default features, with testing
        run: cargo clippy --locked -p rdy-engine --no-default-features --features testing --all-targets -- -D warnings
      - name: cargo doc rdy-engine without default features
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked -p rdy-engine --no-default-features --no-deps
      # rdy-cloud builds rdy-engine with `default-features = false, features = ["html"]` (02, M1-077). Lint and
      # document that build. `--all-targets` turns on the dev-dependency features, like the steps above, so
      # the library alone is not linted without them (a gap carried in backlog correction-31).
      - name: cargo clippy rdy-engine html feature without the runtime
        run: cargo clippy --locked -p rdy-engine --no-default-features --features html --all-targets -- -D warnings
      - name: cargo doc rdy-engine html feature without the runtime
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked -p rdy-engine --no-default-features --features html --no-deps
      # The loopback servers (ADR 0035) are public items behind a feature. Document them with warnings
      # as errors, on the build without the runtime, which is the narrowest one that has them.
      - name: cargo doc rdy-engine loopback feature
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked -p rdy-engine --no-default-features --features loopback --no-deps
      # The JSON schemas are generated from the rdy-spec types. A type or doc comment that changed
      # without `cargo xtask schema` fails here and names the file to regenerate.
      - name: Generated schemas are current
        run: cargo run --locked --quiet --package xtask -- schema --check
      # The k8s.version fixtures are written by a script (tests/fixtures/README.md, origin `generated`). A
      # change to the script or to a fixture without the other fails here.
      - name: k8s.version fixtures are current
        run: python3 -I scripts/gen-k8s-version-fixtures.py --check
      - name: k8s.rbac fixtures are current
        run: python3 -I scripts/gen-k8s-rbac-fixtures.py --check
      # Same for the k8s.storageclass fixtures.
      - name: k8s.storageclass fixtures are current
        run: python3 -I scripts/gen-k8s-storageclass-fixtures.py --check
      # The HTML report prints untrusted text. askama escapes it unless a template or the code switches
      # that off. The only raw value is the embedded result, in the private `EmbeddedJson` of the page
      # (M1-078, SEC-64): the script fails on `|safe`, `escape = "none"`, a second safe marker, `{{ json }}`
      # anywhere but the data block, and the askama features that add filters.
      - name: No askama escape bypass
        run: |
          sh scripts/test-check-html-escapes.sh
          sh scripts/check-html-escapes.sh
      # The schema generator is the optional `schema` feature of rdy-spec. It pulls in schemars and
      # serde_json/preserve_order, which must stay out of the shipped binary (ADR 0019).
      - name: The binary does not build the schema generator
        run: |
          tree="$(cargo tree --locked -p rdy -e normal,build,features --target x86_64-unknown-linux-gnu)"
          if printf '%s\n' "$tree" | grep -E 'preserve_order|rdy-spec feature "schema"|rdy-engine feature "(testing|loopback)"'; then
            echo "::error::the rdy binary would build the schema generator, serde_json/preserve_order or an rdy-engine test feature"
            exit 1
          fi
      # rdy-cli's tests turn on the rdy-engine `testing` feature (the panicking-redactor seam) through a
      # dev-dependency. It must never reach the shipped binary, so check the normal build graph.
      - name: The binary does not build the rdy-engine testing or loopback feature
        run: |
          tree="$(cargo tree --locked -p rdy -e normal,features --target x86_64-unknown-linux-gnu)"
          if printf '%s\n' "$tree" | grep -E 'rdy-engine feature "(testing|loopback)"'; then
            echo "::error::the rdy binary would build the rdy-engine testing or loopback feature"
            exit 1
          fi
          # The loopback servers make certificates with rcgen. Nothing in the shipped tree may use it
          # (ADR 0035). tokio-rustls is in the shipped tree on purpose: the facade's TLS uses it (M1-092).
          if cargo tree --locked -p rdy -e normal --target x86_64-unknown-linux-gnu -i rcgen 2>/dev/null | grep -q '^rcgen v'; then
            echo "::error::the rdy binary would build rcgen"
            exit 1
          fi
      # TLS is rustls on ring everywhere (ADR 0009, CLAUDE.md rule 5). aws-lc-sys must not be anywhere in
      # the resolved graph, for any target or feature. `cargo tree -i` prints a package only when it is
      # there, and fails with "did not match any packages" when it is not.
      - name: No aws-lc in the dependency graph
        run: |
          status=0
          out="$(cargo tree --locked --workspace --all-features --target all -e normal,build,dev -i aws-lc-sys 2>&1)" || status=$?
          if printf '%s\n' "$out" | grep -q '^aws-lc-sys v'; then
            printf '%s\n' "$out"
            echo "::error::aws-lc-sys is in the dependency graph; TLS must stay on ring"
            exit 1
          fi
          # A failure of cargo tree itself (a stale lock file, a network error) is not "absent".
          if [ "$status" -ne 0 ] && ! printf '%s\n' "$out" | grep -q 'did not match any packages'; then
            printf '%s\n' "$out"
            echo "::error::cargo tree failed, so the aws-lc check proved nothing"
            exit 1
          fi
      # exec::run and ExecSpec::new are pub(crate) without the `testing` feature. A normal build, with no
      # dev-dependencies, must compile with that narrower surface.
      - name: The binary builds without the testing feature
        run: cargo check --locked -p rdy
      # A --workspace build turns the schema feature on through xtask. This runs the binary's own feature
      # set for the normal dependencies. Tests of rdy still see the dev-dependency `testing` feature of
      # rdy-engine, which the guard above keeps out of the shipped binary.
      - name: Test the binary's feature set
        run: cargo test --locked -p rdy -p rdy-engine

  # zizmor has its own job on purpose. It runs no cargo, so build scripts and proc macros from a PR
  # never run beside its token or its binary. Do not add cargo steps here.
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: zizmor@1.31.1
      - name: zizmor
        env:
          # Read-only token for zizmor's online audits (impostor commits, known-vulnerable actions).
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .

  deny:
    name: deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: deny
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-deny
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny
        run: cargo deny --locked check
      # The wall around check crates (M1-044): a throwaway workspace with the names of the real crates runs
      # the real deny.toml, and a check crate that depends on socket2 or walkdir must fail. The variable makes
      # a missing cargo-deny fail the test, never skip it. The `test` legs have no cargo-deny and skip it.
      - name: A check crate cannot depend on a walled crate
        env:
          RDY_REQUIRE_CARGO_DENY: "1"
        run: cargo test --locked -p rdy-lint-wall --test deny_wrappers

  dco:
    name: dco
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check walks the PR's commits, so it needs full history.
          fetch-depth: 0
          persist-credentials: false
      - name: Install shellcheck
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: shellcheck@0.11.0
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: DCO script tests
        run: sh scripts/test-check-dco.sh
      # Offline: a fake curl answers from scripts/test-check-org-settings.json. No token, no network.
      - name: Org settings check script tests
        run: sh scripts/test-check-org-settings.sh
      # On push to main the job passes without checking. Squash and rebase merges
      # rewrite commits, and the PR already passed this check before it merged.
      - name: Every commit has a Signed-off-by line
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"

  # install.sh (M1-014, SEC-08): shellcheck, then the shell tests with stub curl, id and uname. dash runs
  # on the runner. busybox sh runs in an Alpine container pinned by digest, because Alpine's busybox
  # looks up applets on PATH and so runs the stubs. The Ubuntu busybox-static package runs its own
  # built-in id, uname and sha256sum first, so the stubs would be ignored. The harness checks this
  # before the suite and fails if the stubs are bypassed. macOS /bin/sh runs in the `test` job.
  # The tests fail, not skip, when a shell is missing (CI is set).
  install-sh:
    name: install-sh
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # alpine:3.24 (3.24.3), index digest resolved 2026-10-29. Dependabot does not read this line.
      # Bump the tag and the digest by hand when the Alpine release line moves.
      ALPINE_IMAGE: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: shellcheck@0.11.0
      - name: shellcheck
        run: shellcheck install.sh scripts/test-install-sh.sh
      - name: Shell tests (dash)
        run: sh scripts/test-install-sh.sh dash
      # The repo is mounted read-only. The tests write only under the container's /tmp. openssl and
      # perl-utils (shasum) are there to test the other two hash tools.
      - name: Shell tests (busybox sh, Alpine)
        run: |
          docker run --rm -e CI=true -v "$PWD:/src:ro" "$ALPINE_IMAGE" \
            sh -c 'apk add --no-cache openssl perl-utils > /dev/null && sh /src/scripts/test-install-sh.sh busybox'

  # Four native test legs and one compile leg (docs/plan/06, ADR 0006 decision 8). The Linux legs
  # build and test the musl targets, so CI tests what ships. The org has no macOS arm64 runners
  # (correction 05), so `macos-arm64-compile` builds the aarch64-apple-darwin target and compiles its
  # tests on the Intel runner without running them. The full macos-arm64 test job is in
  # macos-arm64.yml, outside ci-ok, until the org has those runners. fail-fast is off so one red leg
  # does not hide the others. There are no retries: a test that fails once in three runs is a bug.
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        # One shell on every runner, so the steps below are the same on Windows.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { name: macos-x64, os: macos-15-intel, target: x86_64-apple-darwin }
          - { name: macos-arm64-compile, os: macos-15-intel, target: aarch64-apple-darwin, compile_only: true }
          - { name: windows-x64, os: windows-2022, target: x86_64-pc-windows-msvc }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      # Windows checkouts convert line endings by default. Turn that on before checkout so the canary in
      # crates/rdy-spec/tests/fixture_canary.rs proves .gitattributes protects the fixtures.
      - name: Set core.autocrlf true (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # install.sh under macOS /bin/sh (bash in POSIX mode) with the BSD tools. The dash and busybox
      # runs are in the install-sh job.
      - name: install.sh tests (macOS /bin/sh)
        if: matrix.name == 'macos-x64'
        run: sh scripts/test-install-sh.sh sh
      - name: Install musl-tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          # C code in a dependency (ring, later) builds with musl's compiler. Set CC only.
          # Never set the linker to musl-gcc: its wrappers do not handle static-pie.
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Install the pinned toolchain and the target
        run: |
          rustup toolchain install --no-self-update
          rustup target add "$TARGET"
      # PRs read the cache that main saved. Only main writes it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        if: ${{ !matrix.compile_only }}
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@0.9.149
          # A missing prebuilt binary fails the step. It never falls back to `cargo install`.
          fallback: none
      - name: Build the rdy binary
        if: ${{ !matrix.compile_only }}
        run: cargo build --locked --target "$TARGET" --package rdy
      # The compile leg cannot run aarch64 code on an Intel host. It proves every crate, binary and
      # test still compiles for aarch64-apple-darwin.
      - name: Build the workspace and compile its tests (no run)
        if: ${{ matrix.compile_only }}
        run: |
          cargo build --workspace --locked --target "$TARGET"
          cargo test --workspace --no-run --locked --target "$TARGET"
      # ADR 0006, decision 2: static-pie, full RELRO, non-executable stack, checked with readelf.
      - name: Static-musl proof (readelf)
        if: runner.os == 'Linux'
        run: |
          sh scripts/test-musl-pie-linker.sh
          sh scripts/test-check-static.sh
          # The release workflow runs this script on the real artifacts (M1-007).
          sh scripts/test-check-release-artifacts.sh
          scripts/check-static.sh "target/$TARGET/debug/rdy"
      # `scratch` is not a pullable image, so import an empty one. It has no shell and no libc, so
      # the binary only runs if it is truly static. Non-root, no network, read-only root, no capabilities.
      - name: Run the binary in a scratch container
        if: runner.os == 'Linux'
        run: |
          dir=$(mktemp -d)
          cp "target/$TARGET/debug/rdy" "$dir/rdy"
          chmod 755 "$dir"
          tar -cT /dev/null | docker import - rdy-scratch
          out=$(docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --user 65534:65534 -v "$dir:/rdy:ro" rdy-scratch /rdy/rdy version)
          echo "$out"
          echo "$out" | grep -q '^rdy '
      # The C minisign program is the other end of the interop test (M1-125, ADR 0022). It is installed
      # on this leg only, and the variable below makes a missing program fail the test, never skip it.
      - name: Install C minisign
        if: matrix.name == 'linux-x64'
        run: sudo apt-get install -y --no-install-recommends minisign
      # `setcap` is in libcap2-bin. The setuid-gate test (M1-074, INV-10) copies the rdy binary, makes
      # the copy setuid root and, separately, gives it a file capability, with passwordless sudo. The
      # variable below makes a missing `sudo` or `setcap` fail the test, never skip it.
      - name: Install libcap2-bin
        if: matrix.name == 'linux-x64'
        run: sudo apt-get install -y --no-install-recommends libcap2-bin
      # `assert_golden` records each golden it compares in target/goldens-used. A restored cache must not
      # carry a record from an older run, which could hide an orphan (08 section 3, M1-052).
      - name: Reset the golden usage record
        if: matrix.name == 'linux-x64'
        run: rm -rf target/goldens-used
      - name: Test (nextest, no retries)
        if: ${{ !matrix.compile_only }}
        env:
          RDY_REQUIRE_C_MINISIGN: ${{ matrix.name == 'linux-x64' && '1' || '' }}
          RDY_REQUIRE_SETUID: ${{ matrix.name == 'linux-x64' && '1' || '' }}
        run: cargo nextest run --workspace --locked --target "$TARGET" --profile ci
      # A golden file that no test compared is an orphan: its test was renamed or deleted (M1-052).
      - name: No orphaned golden files
        if: matrix.name == 'linux-x64'
        run: cargo run --locked --quiet --package xtask -- goldens check
      # nextest does not run doc tests. They build for the host, so they run on one leg only.
      - name: Doc tests
        if: matrix.name == 'linux-x64'
        run: cargo test --doc --workspace --locked
      # Root tests are named `root_*` and the `ci` profile skips them (.config/nextest.toml). This proves
      # the normal run lists none, so a root test can never run, or fail, on a user-level runner.
      - name: The normal run lists no root_* test
        if: matrix.name == 'linux-x64'
        run: |
          list="$(cargo nextest list --workspace --locked --target "$TARGET" --profile ci --message-format oneline)"
          test -n "$list"
          if printf '%s\n' "$list" | grep -E '(^|[ :])root_[^: ]*$'; then
            echo "::error::the ci profile lists a root_* test; check default-filter in .config/nextest.toml"
            exit 1
          fi

  # Tests that need uid 0 (docs/plan/08-testing.md, section 6). Convention: the test name starts with
  # `root_`. The default and `ci` nextest profiles skip them; the `root` profile runs only them.
  # The build runs as the runner user, so `target/` and the cache stay user-owned. Only the finished
  # nextest archive runs under `sudo`. It needs no cargo and no rustup, so root never touches ~/.cargo.
  # The runner is a fresh VM with passwordless sudo, so a PR's test code gets nothing here that it
  # did not already have in the `test` job.
  root:
    name: root
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      TARGET: x86_64-unknown-linux-musl
      # Makes a `root_*` test fail, not skip, when it does not run as uid 0.
      RDY_REQUIRE_ROOT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # strace is for the root tests that watch syscalls (trust lookup, no phone home). musl-tools is
      # the same C compiler the `test` job uses.
      - name: Install strace and musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
          strace -V
      - name: Install the pinned toolchain and the target
        run: |
          rustup toolchain install --no-self-update
          rustup target add "$TARGET"
      # Same key as the linux-x64 test leg, so this job reuses its build. It never saves.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-linux-x64
          save-if: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@0.9.149
      - name: Build the nextest archive (as the runner user)
        run: >
          cargo nextest archive --workspace --locked --target "$TARGET"
          --archive-file "$RUNNER_TEMP/rdy-tests.tar.zst"
      - name: Run the root_* tests under sudo
        run: |
          nextest="$(command -v cargo-nextest)"
          echo "uid under sudo: $(sudo id -u)"
          test "$(sudo id -u)" = 0
          sudo --preserve-env=RUST_BACKTRACE,CARGO_TERM_COLOR,RDY_REQUIRE_ROOT \
            "$nextest" nextest run \
            --archive-file "$RUNNER_TEMP/rdy-tests.tar.zst" \
            --workspace-remap "$PWD" \
            --profile root --no-tests=fail

  # release.yml is dist's output plus scripts/harden-release-workflow.py (ADR 0020). dist's own drift
  # check is off (`allow-dirty`), so this job is the drift check: it regenerates the file from a
  # hash-checked dist and fails on any difference. It also runs the tests of the release scripts.
  release-workflow:
    name: release-workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - name: Install dist (pinned file, sha256 checked)
        run: sh scripts/install-release-tool.sh dist
      - name: Script tests
        run: |
          sh scripts/test-install-release-tool.sh
          sh scripts/test-harden-release-workflow.sh
          sh scripts/test-sign-release.sh
          sh scripts/test-verify-release.sh
      - name: release.yml matches dist and the hardening script
        run: sh scripts/gen-release-workflow.sh --check

  # The M1-077 exit test says the page passes an HTML validator. The Nu HTML Checker (pinned, sha256
  # checked in the script) runs over the HTML goldens with --Werror. It is third-party code, so it has its
  # own job: checkout and the runner's Java only, no cargo, no rust-cache, a read-only token. `well_formed`
  # in rdy-engine's html_report test is the smoke test on all five legs of `test`.
  html-validator:
    name: html-validator
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The HTML goldens pass the Nu HTML Checker
        run: |
          java -version
          scripts/validate-html.sh

  # M1-010: the real cosign verify-blob forms from 06 against real keyless signatures: cosign's own
  # v3.1.4 release (identity and issuer) and goreleaser v2.19.0 (a GitHub Actions run: identity, issuer,
  # repository, ref and trigger), each also after a change that must fail. It needs the network (GitHub
  # and Sigstore's TUF mirror) and cosign, which the pinned installer provides. It is in ci-ok (ADR 0024).
  cosign-roundtrip:
    name: cosign-roundtrip
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cosign (pinned file, sha256 checked)
        run: sh scripts/install-release-tool.sh cosign
      - name: verify-blob passes with the exact identity and claims, and fails on every change
        run: sh scripts/test-cosign-roundtrip.sh

  # The only required check. Keep `needs:` equal to the list of gating jobs.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, zizmor, deny, dco, install-sh, test, html-validator, root, release-workflow, cosign-roundtrip]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every gating job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
