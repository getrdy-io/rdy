# CI for rdy. docs/plan/06-release-and-distribution.md describes the design.
#
# Rules for this file (SEC-01, SEC-03):
# - Every `uses:` line is pinned to a full commit SHA with the version in a comment.
# - The token is read-only. Each job names the permissions it needs.
# - No pull_request_target. Fork PRs get a read-only token.
# - `ci-ok` is the only required check. It lists every gating job in `needs:`.
#   Add each new gating job there (M1-006 adds the test matrix and install-sh).
# - No path filters. A path-filtered required check goes pending and blocks merges.
# - The Rust toolchain comes from rust-toolchain.toml. Do not name a version here.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_NET_RETRY: "3"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      # PRs read the cache that main saved. Only main writes it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  # zizmor has its own job on purpose. It runs no cargo, so build scripts and proc macros from a PR
  # never run beside its token or its binary. Do not add cargo steps here.
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: zizmor@1.31.1
      - name: zizmor
        env:
          # Read-only token for zizmor's online audits (impostor commits, known-vulnerable actions).
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .

  deny:
    name: deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: deny
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-deny
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny
        run: cargo deny --locked check

  dco:
    name: dco
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check walks the PR's commits, so it needs full history.
          fetch-depth: 0
          persist-credentials: false
      - name: Install shellcheck
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: shellcheck@0.11.0
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: DCO script tests
        run: sh scripts/test-check-dco.sh
      # On push to main the job passes without checking. Squash and rebase merges
      # rewrite commits, and the PR already passed this check before it merged.
      - name: Every commit has a Signed-off-by line
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"

  # The only required check. Keep `needs:` equal to the list of gating jobs.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, zizmor, deny, dco]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every gating job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
