# CI for rdy. docs/plan/06-release-and-distribution.md describes the design.
#
# Rules for this file (SEC-01, SEC-03):
# - Every `uses:` line is pinned to a full commit SHA with the version in a comment. The zizmor job
#   enforces it (.github/zizmor.yml, unpinned-uses with hash-pin for every owner), and Dependabot
#   keeps the pins current (.github/dependabot.yml).
# - The token is read-only. Each job names the permissions it needs.
# - No pull_request_target. Fork PRs get a read-only token.
# - `ci-ok` is the only required check. It lists every gating job in `needs:`.
#   Add each new gating job there. A matrix job is one entry: it is green only when every leg is.
# - No path filters. A path-filtered required check goes pending and blocks merges.
# - The Rust toolchain comes from rust-toolchain.toml. Do not name a version here.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_NET_RETRY: "3"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      # PRs read the cache that main saved. Only main writes it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      # The JSON schemas are generated from the rdy-spec types. A type or doc comment that changed
      # without `cargo xtask schema` fails here and names the file to regenerate.
      - name: Generated schemas are current
        run: cargo run --locked --quiet --package xtask -- schema --check
      # The schema generator is the optional `schema` feature of rdy-spec. It pulls in schemars and
      # serde_json/preserve_order, which must stay out of the shipped binary (ADR 0019).
      - name: The binary does not build the schema generator
        run: |
          tree="$(cargo tree --locked -p rdy -e features --target x86_64-unknown-linux-gnu)"
          if printf '%s\n' "$tree" | grep -E 'preserve_order|rdy-spec feature "schema"|rdy-engine feature "testing"'; then
            echo "::error::the rdy binary would build the schema generator, serde_json/preserve_order or the rdy-engine testing feature"
            exit 1
          fi
      # exec::run and ExecSpec::new are pub(crate) without the `testing` feature. A normal build, with no
      # dev-dependencies, must compile with that narrower surface.
      - name: The binary builds without the testing feature
        run: cargo check --locked -p rdy
      # A --workspace build turns the feature on through xtask. This runs the binary's own feature set.
      - name: Test the binary's feature set
        run: cargo test --locked -p rdy -p rdy-engine

  # zizmor has its own job on purpose. It runs no cargo, so build scripts and proc macros from a PR
  # never run beside its token or its binary. Do not add cargo steps here.
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: zizmor@1.31.1
      - name: zizmor
        env:
          # Read-only token for zizmor's online audits (impostor commits, known-vulnerable actions).
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .

  deny:
    name: deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: deny
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-deny
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny
        run: cargo deny --locked check

  dco:
    name: dco
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check walks the PR's commits, so it needs full history.
          fetch-depth: 0
          persist-credentials: false
      - name: Install shellcheck
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: shellcheck@0.11.0
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: DCO script tests
        run: sh scripts/test-check-dco.sh
      # Offline: a fake curl answers from scripts/test-check-org-settings.json. No token, no network.
      - name: Org settings check script tests
        run: sh scripts/test-check-org-settings.sh
      # On push to main the job passes without checking. Squash and rebase merges
      # rewrite commits, and the PR already passed this check before it merged.
      - name: Every commit has a Signed-off-by line
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"

  # Four native test legs and one compile leg (docs/plan/06, ADR 0006 decision 8). The Linux legs
  # build and test the musl targets, so CI tests what ships. The org has no macOS arm64 runners
  # (correction 05), so `macos-arm64-compile` builds the aarch64-apple-darwin target and compiles its
  # tests on the Intel runner without running them. The full macos-arm64 test job is in
  # macos-arm64.yml, outside ci-ok, until the org has those runners. fail-fast is off so one red leg
  # does not hide the others. There are no retries: a test that fails once in three runs is a bug.
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        # One shell on every runner, so the steps below are the same on Windows.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { name: macos-x64, os: macos-15-intel, target: x86_64-apple-darwin }
          - { name: macos-arm64-compile, os: macos-15-intel, target: aarch64-apple-darwin, compile_only: true }
          - { name: windows-x64, os: windows-2022, target: x86_64-pc-windows-msvc }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      # Windows checkouts convert line endings by default. Turn that on before checkout so the canary in
      # crates/rdy-spec/tests/fixture_canary.rs proves .gitattributes protects the fixtures.
      - name: Set core.autocrlf true (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl-tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          # C code in a dependency (ring, later) builds with musl's compiler. Set CC only.
          # Never set the linker to musl-gcc: its wrappers do not handle static-pie.
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Install the pinned toolchain and the target
        run: |
          rustup toolchain install --no-self-update
          rustup target add "$TARGET"
      # PRs read the cache that main saved. Only main writes it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        if: ${{ !matrix.compile_only }}
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@0.9.149
          # A missing prebuilt binary fails the step. It never falls back to `cargo install`.
          fallback: none
      - name: Build the rdy binary
        if: ${{ !matrix.compile_only }}
        run: cargo build --locked --target "$TARGET" --package rdy
      # The compile leg cannot run aarch64 code on an Intel host. It proves every crate, binary and
      # test still compiles for aarch64-apple-darwin.
      - name: Build the workspace and compile its tests (no run)
        if: ${{ matrix.compile_only }}
        run: |
          cargo build --workspace --locked --target "$TARGET"
          cargo test --workspace --no-run --locked --target "$TARGET"
      # ADR 0006, decision 2: static-pie, full RELRO, non-executable stack, checked with readelf.
      - name: Static-musl proof (readelf)
        if: runner.os == 'Linux'
        run: |
          sh scripts/test-musl-pie-linker.sh
          sh scripts/test-check-static.sh
          # The release workflow runs this script on the real artifacts (M1-007).
          sh scripts/test-check-release-artifacts.sh
          scripts/check-static.sh "target/$TARGET/debug/rdy"
      # `scratch` is not a pullable image, so import an empty one. It has no shell and no libc, so
      # the binary only runs if it is truly static. Non-root, no network, read-only root, no capabilities.
      - name: Run the binary in a scratch container
        if: runner.os == 'Linux'
        run: |
          dir=$(mktemp -d)
          cp "target/$TARGET/debug/rdy" "$dir/rdy"
          chmod 755 "$dir"
          tar -cT /dev/null | docker import - rdy-scratch
          out=$(docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --user 65534:65534 -v "$dir:/rdy:ro" rdy-scratch /rdy/rdy version)
          echo "$out"
          echo "$out" | grep -q '^rdy '
      - name: Test (nextest, no retries)
        if: ${{ !matrix.compile_only }}
        run: cargo nextest run --workspace --locked --target "$TARGET" --profile ci
      # nextest does not run doc tests. They build for the host, so they run on one leg only.
      - name: Doc tests
        if: matrix.name == 'linux-x64'
        run: cargo test --doc --workspace --locked
      # Root tests are named `root_*` and the `ci` profile skips them (.config/nextest.toml). This proves
      # the normal run lists none, so a root test can never run, or fail, on a user-level runner.
      - name: The normal run lists no root_* test
        if: matrix.name == 'linux-x64'
        run: |
          list="$(cargo nextest list --workspace --locked --target "$TARGET" --profile ci --message-format oneline)"
          test -n "$list"
          if printf '%s\n' "$list" | grep -E '(^|[ :])root_[^: ]*$'; then
            echo "::error::the ci profile lists a root_* test; check default-filter in .config/nextest.toml"
            exit 1
          fi

  # Tests that need uid 0 (docs/plan/08-testing.md, section 6). Convention: the test name starts with
  # `root_`. The default and `ci` nextest profiles skip them; the `root` profile runs only them.
  # The build runs as the runner user, so `target/` and the cache stay user-owned. Only the finished
  # nextest archive runs under `sudo`. It needs no cargo and no rustup, so root never touches ~/.cargo.
  # The runner is a fresh VM with passwordless sudo, so a PR's test code gets nothing here that it
  # did not already have in the `test` job.
  root:
    name: root
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      TARGET: x86_64-unknown-linux-musl
      # Makes a `root_*` test fail, not skip, when it does not run as uid 0.
      RDY_REQUIRE_ROOT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # strace is for the root tests that watch syscalls (trust lookup, no phone home). musl-tools is
      # the same C compiler the `test` job uses.
      - name: Install strace and musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
          strace -V
      - name: Install the pinned toolchain and the target
        run: |
          rustup toolchain install --no-self-update
          rustup target add "$TARGET"
      # Same key as the linux-x64 test leg, so this job reuses its build. It never saves.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-linux-x64
          save-if: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@0.9.149
      - name: Build the nextest archive (as the runner user)
        run: >
          cargo nextest archive --workspace --locked --target "$TARGET"
          --archive-file "$RUNNER_TEMP/rdy-tests.tar.zst"
      - name: Run the root_* tests under sudo
        run: |
          nextest="$(command -v cargo-nextest)"
          echo "uid under sudo: $(sudo id -u)"
          test "$(sudo id -u)" = 0
          sudo --preserve-env=RUST_BACKTRACE,CARGO_TERM_COLOR,RDY_REQUIRE_ROOT \
            "$nextest" nextest run \
            --archive-file "$RUNNER_TEMP/rdy-tests.tar.zst" \
            --workspace-remap "$PWD" \
            --profile root --no-tests=fail

  # release.yml is dist's output plus scripts/harden-release-workflow.py (ADR 0020). dist's own drift
  # check is off (`allow-dirty`), so this job is the drift check: it regenerates the file from a
  # hash-checked dist and fails on any difference. It also runs the tests of the release scripts.
  release-workflow:
    name: release-workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - name: Install dist (pinned file, sha256 checked)
        run: sh scripts/install-release-tool.sh dist
      - name: Script tests
        run: |
          sh scripts/test-install-release-tool.sh
          sh scripts/test-harden-release-workflow.sh
          sh scripts/test-sign-release.sh
      - name: release.yml matches dist and the hardening script
        run: sh scripts/gen-release-workflow.sh --check

  # M1-010: the real cosign verify-blob form from 06 against a real keyless signature (cosign's own
  # v3.1.4 release), and the same call after one byte changes. It needs the network (GitHub and
  # Sigstore's TUF mirror) and cosign, which the pinned installer provides. It is NOT in ci-ok yet.
  # It was written without a cosign binary to run it on (ADR 0024). Add it to `needs:` of ci-ok after
  # the first green run.
  cosign-roundtrip:
    name: cosign-roundtrip
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cosign (pinned file, sha256 checked)
        run: sh scripts/install-release-tool.sh cosign
      - name: verify-blob passes with the exact identity and fails after one byte changes
        run: sh scripts/test-cosign-roundtrip.sh

  # The only required check. Keep `needs:` equal to the list of gating jobs.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, zizmor, deny, dco, test, root, release-workflow]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every gating job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
