# Full test job on macOS arm64, outside the ci-ok gate (correction 05, ADR 0006 decision 8).
#
# The org has no macOS arm64 runners, so a `macos-15` job may never get one. A job that waits for
# a runner must not block merges, so this workflow is not a PR check and is not in ci-ok's needs.
# ci.yml still compiles the aarch64-apple-darwin target on every PR (the macos-arm64-compile leg).
# When the org has arm64 runners, move this job into the `test` matrix in ci.yml, add it to ci-ok,
# and delete this file (Founder hand steps, docs/plan/11-backlog.md).
#
# Same rules as ci.yml: every `uses:` is pinned to a full commit SHA, the token is read-only, no
# pull_request_target, and the Rust toolchain comes from rust-toolchain.toml.

name: macos-arm64

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: macos-arm64-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_NET_RETRY: "3"
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: test (macos-arm64)
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and the target
        run: |
          rustup toolchain install --no-self-update
          rustup target add "$TARGET"
      # Only main writes the cache, as in ci.yml.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-macos-arm64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@0.9.149
      - name: Build the rdy binary
        run: cargo build --locked --target "$TARGET" --package rdy
      - name: Test (nextest, no retries)
        run: cargo nextest run --workspace --locked --target "$TARGET" --profile ci
