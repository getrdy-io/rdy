# The direct dependencies a check crate may have (INV-07, docs/plan/02-engine-design.md "Lint wall", ADR 0014
# decision 7, M1-044). Normal and build dependencies only: dev-dependencies are not listed, except that
# tests/lint-wall/tests/deps_allowlist.rs holds two of them (`tempfile`, `tokio-rustls`) to rdy-checks-k8s.
#
# A check crate reaches the OS through its Probe. Clippy bans the std items. It cannot ban another crate's
# API (tokio::fs, cap_std, TcpSocket, JoinSet::spawn, hyper-util, rustix and the rest), so the only way a
# check crate can use one is to depend on it, and this file says which crates it may depend on.
# tests/lint-wall/tests/deps_allowlist.rs reads `cargo metadata` and fails on any direct normal or build
# dependency of a `rdy-checks-*` crate that is not listed for it here.
#
# Rules:
# - Every `crates/rdy-checks-*` crate has a section. A new check crate fails the test until it has one.
# - A change to this file needs the `security-review` label (CODEOWNERS covers /ci/).
# - Never add tokio, cap-std, cap-primitives, rustix, nix, socket2, hyper, hyper-util, walkdir, tempfile,
#   sysinfo, which, ureq, reqwest or hickory-*. The test refuses them. A check needs the machine through
#   the Probe, not through a crate.
# - One section, then one `allow = [..]` line, sorted. Nothing else is read.

# rdy-checks-host: the base list of 02, and toml for the embedded agents.toml catalog (M1-146, 03 Appendix B).
# toml is a parser. It reads text that include_str! put in the binary and touches no file.
[rdy-checks-host]
allow = ["futures-util", "rdy-engine", "rdy-spec", "serde", "serde_json", "thiserror", "toml"]

# rdy-checks-net: the base list, and x509-parser for the TLS interception check (02).
[rdy-checks-net]
allow = ["futures-util", "rdy-engine", "rdy-spec", "serde", "serde_json", "thiserror", "x509-parser"]

# rdy-checks-k8s: the base list, and the only crate that may depend on kube (deny.toml) and k8s-openapi.
# `secrecy` holds kubeconfig token values until they are handed to the known-secret set (M1-102, M1-061).
# `http`, `http-body`, `tower-layer` and `tower-service` are the types the read-only guard layer names
# (M1-103). They hold no I/O. `toml` reads the embedded provisioners.toml table (M1-110, 03 Appendix B);
# it is a parser, as in rdy-checks-host.
[rdy-checks-k8s]
allow = ["futures-util", "http", "http-body", "k8s-openapi", "kube", "rdy-engine", "rdy-spec", "secrecy", "serde", "serde_json", "thiserror", "toml", "tower-layer", "tower-service"]
