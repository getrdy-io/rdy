# Synthetic example. Four checks (host.disk is listed once per OS family),
# no Kubernetes, nothing that needs root.
# This is the spec the README and the quickstart use, so a laptop can reach
# a real result in a few seconds.
#
# Expect NOT READY on the first run. net.egress is required, and the current
# build of rdy has no net checks yet, so it reports that check as not run.
# Once the net checks land, registry.acme.example (a made-up name that does
# not resolve) will BLOCK. To see READY then, copy this file and point
# net.egress at a host you can reach, for example github.com:443.
#
# This file is unsigned. Run it with --allow-unsigned; rdy prints a warning.
# host.disk appears twice, one entry per OS family, to show the name field.
apiVersion: rdy/v1
kind: Readiness
metadata:
  product: acme-quickstart
  version: ">=1.0"
checks:
  - id: host.cpu
    min: 4
    severity: block
    fix: "Use a machine with at least 4 CPU cores."
  - id: host.memory
    min: 8Gi
    severity: block
    fix: "Add RAM or choose a larger node class."
  - id: host.disk
    name: root
    os: [linux, macos]
    path: /
    min: 20Gi
    severity: warn
    fix: "Free space on / or mount a larger volume."
  - id: host.disk
    name: system
    os: [windows]
    path: 'C:\'
    min: 20Gi
    severity: warn
    fix: "Free space on C: or use a larger disk."
  - id: net.egress
    endpoints: ["registry.acme.example:443", "license.acme.example:443"]
    via_proxy: auto
    severity: block
    fix: "Ask your network team to allow these endpoints through the proxy."
