# Synthetic example. GPU inference on Kubernetes. For later: the gpu
# family ships in M4. This file parses today. Until the gpu family
# exists rdy reports the gpu.* checks as skipped, and runs the rest.
#
# Required checks that cannot run make the verdict NOT READY. This file will
# not reach READY until the gpu family ships.
apiVersion: rdy/v1
kind: Readiness
metadata:
  product: acme-inference
  version: ">=0.9"
checks:
  - id: gpu.driver
    min: "550.54"
    severity: block
    fix: "Install NVIDIA driver 550.54 or newer on every GPU node."
  - id: gpu.cuda
    min: "12.4"
    severity: block
    fix: "Install CUDA 12.4 or newer on every GPU node."
  - id: gpu.vram
    per: gpu
    min: 40Gi
    severity: block
    fix: "Use GPU instances with at least 40 GiB of memory each."
  - id: gpu.device_plugin
    resource: nvidia.com/gpu
    severity: block
    fix: "Install the NVIDIA device plugin and check that nodes advertise nvidia.com/gpu."
  - id: k8s.nodes
    min_ready: 2
    per_node:
      memory: 128Gi
    severity: warn
    fix: "Use nodes with 128 GiB of memory, or expect lower throughput."
  - id: net.egress
    endpoints: ["models.acme.example:443", "registry.acme.example:443"]
    via_proxy: auto
    severity: block
    fix: "Allow model downloads, or load the weights from an internal mirror."
bundle:
  collect: ["k8s:events", "file:/etc/acme/*.yaml"]
  redact: ["aws_keys", "bearer_tokens", "emails"]
