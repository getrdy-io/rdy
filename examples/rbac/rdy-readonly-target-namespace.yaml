# OPTIONAL: lets rdy list the Services of the install namespace, for the `k8s.ingress` check. This is a
# template.
#
# `k8s.ingress` looks for LoadBalancer Services that stay pending, only when the vendor's spec says the
# product needs a load balancer. Without this Role it still checks the ingress classes and the Gateway API,
# and reports the Services as not evaluated, with a `kubectl auth can-i` hint. A Service holds a selector,
# ports and annotations that can carry sensitive configuration. rdy keeps only the name, the age, the type
# and whether an address is assigned, but the grant is the grant, so it is a Role of one namespace, `list`
# only, and the main file does not hold it.
#
# Use it once, in the install namespace of the spec:
#   sed -e 's/<target-namespace>/acme-system/g' rdy-readonly-target-namespace.yaml | kubectl apply -f -
# Apply rdy-readonly.yaml first: the binding names its service account. Delete the Role and the binding
# when you are done.
#
# Check it: kubectl auth can-i list services -n <target-namespace> \
#   --as=system:serviceaccount:rdy-system:rdy-readonly
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rdy-readonly-target-namespace
  namespace: <target-namespace>
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rdy-readonly-target-namespace
  namespace: <target-namespace>
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rdy-readonly-target-namespace
subjects:
  - kind: ServiceAccount
    name: rdy-readonly
    namespace: rdy-system
