# A read-only identity for rdy. You do not need cluster-admin to run it.
#
# rdy only reads. It lists a few resources and makes three self-review requests (who am I, may I do
# this, what may I do). It never changes a cluster. A guard inside rdy refuses anything else before it
# is sent. This file is the second line: even if the guard had a bug, this identity could not write,
# and it cannot read Secret objects.
#
# What this identity can still see: Pod and Deployment specs and claim events. Listing pods, events and
# deployments can return literal environment variable values, and those often hold credentials. rdy keeps
# only the fields it judges (for pods: requests, node name and phase) and drops the rest.
# Webhook configurations carry a CA bundle (a public certificate) and policies carry rules: rdy keeps
# names, match rules and actions only. The token is still a credential, so keep it short
# lived (the command below asks for one hour) and delete the namespace when you are done.
#
# The rules below are the list in crates/rdy-checks-k8s/src/client/guard/rules.rs (ALLOWED). A test
# keeps the two in step.
#
# Use it:
#   kubectl apply -f rdy-readonly.yaml
#   TOKEN=$(kubectl -n rdy-system create token rdy-readonly --duration 1h)
#   SERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
#   kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' \
#     | base64 -d > ca.crt
#   kubectl config --kubeconfig=ro.kubeconfig set-cluster c --server="$SERVER" \
#     --certificate-authority=ca.crt --embed-certs
#   kubectl config --kubeconfig=ro.kubeconfig set-credentials rdy --token="$TOKEN"
#   kubectl config --kubeconfig=ro.kubeconfig set-context c --cluster=c --user=rdy
#   kubectl config --kubeconfig=ro.kubeconfig use-context c
#   rdy run <spec> --kubeconfig ro.kubeconfig
# If a public CA signed the API server certificate, leave out the ca.crt command and the flags
# --certificate-authority and --embed-certs. Delete the kubeconfig and the roles when you are done:
# kubectl delete -f rdy-readonly.yaml
#
# Discovery (/version, /api, /apis) relies on the system:discovery role, and the self reviews on
# system:basic-user. Every signed-in user has both in a standard cluster. The self review rules are
# listed below anyway, so a cluster that removed them still works.
apiVersion: v1
kind: Namespace
metadata:
  name: rdy-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rdy-readonly
  namespace: rdy-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rdy-readonly
rules:
  # k8s.admission, k8s.storageclass, k8s.rbac, k8s.namespace: the target namespace, its Pod Security labels
  # and its phase.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  # k8s.nodes, k8s.version: capacity, conditions, taints, labels, providerID, kubelet version.
  # k8s.nodes: pod requests, node name and phase (free capacity). k8s.storageclass: claims and their events.
  # k8s.namespace: the quotas and limit ranges of the target namespace.
  # k8s.admission: the Service behind an admission webhook that fails closed (its type only).
  # k8s.dns: the container states of the cluster DNS pods (one list with a label selector; the rest of each
  # pod is dropped).
  - apiGroups: [""]
    resources: ["nodes", "pods", "persistentvolumeclaims", "events", "resourcequotas", "limitranges", "services"]
    verbs: ["list"]
  # k8s.storageclass: classes, the default marker, provisioners and registered drivers.
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes", "csidrivers"]
    verbs: ["list"]
  # k8s.ingress: the ingress classes and their controllers.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["list"]
  # k8s.ingress: the Gateway API classes and whether a controller accepted them. Without the Gateway API
  # installed the server answers 404, which rdy reads as "not installed".
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses"]
    verbs: ["list"]
  # k8s.admission: OpenShift security context constraints. k8s.version: the OpenShift version.
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    verbs: ["list"]
  - apiGroups: ["config.openshift.io"]
    resources: ["clusterversions"]
    resourceNames: ["version"]
    verbs: ["get"]
  # k8s.admission: admission webhooks and ValidatingAdmissionPolicy (names, match rules, failure policy and
  # selectors; CA bundles and CEL expressions are dropped), and the endpoints behind a webhook Service
  # (whether any is ready).
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations", "validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
  # k8s.admission: the policies of Kyverno and Gatekeeper, to name the ones that reject pods. Rules,
  # parameters and CEL expressions are dropped. These groups exist only when the engine is installed.
  - apiGroups: ["kyverno.io"]
    resources: ["clusterpolicies"]
    verbs: ["list"]
  - apiGroups: ["policies.kyverno.io"]
    resources: ["validatingpolicies", "imagevalidatingpolicies"]
    verbs: ["list"]
  # The one wildcard in this file (ADR 0042). Each Gatekeeper ConstraintTemplate creates a constraint kind
  # with a name the template author chooses, so the kinds cannot be listed here. Nothing stops a cluster
  # admin adding another CRD to this group. A list returns whole objects: Gatekeeper parameters, the
  # audit messages in status.violations (they can quote fields of audited objects) and Kyverno
  # ClusterPolicy rules (generate.data often holds registry credentials) are readable with this token,
  # though rdy drops them while reading. Keep the token short lived. For a stricter role, replace "*"
  # with your plurals from: kubectl get crd -l gatekeeper.sh/constraint=yes
  - apiGroups: ["constraints.gatekeeper.sh"]
    resources: ["*"]
    verbs: ["list"]
  # k8s.access, k8s.rbac: who am I, may I do this, what may I do. Nothing is stored.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["selfsubjectreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews", "selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rdy-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rdy-readonly
subjects:
  - kind: ServiceAccount
    name: rdy-readonly
    namespace: rdy-system
---
# OPTIONAL: this Role and RoleBinding (the last two documents). They are limited to kube-system:
# - k8s.nodes looks for the cluster-autoscaler deployment there. Without the Role, k8s.nodes reports
#   "autoscaler not detected" and a node shortfall is not softened.
# - k8s.dns lists the DNS deployments and daemon sets there, and reads the Service kube-dns (on RKE2
#   rke2-coredns-rke2-coredns) and the ConfigMap coredns by name. rdy keeps only replicas, ready counts
#   and container names, the Service address and ports, and the Corefile key. Be aware what the grant is:
#   `list` on deployments and daemonsets in kube-system lets the holder of this token read every
#   Deployment and DaemonSet there in full, env values included. The cluster-wide `list pods` above is the
#   same kind of grant, and is accepted. Without the Role, k8s.dns reports what it could not read and asks
#   for these grants.
# - This Role was named rdy-readonly-deployments before. Applying this file does not remove the old
#   Role and its binding. Remove them: kubectl -n kube-system delete role,rolebinding rdy-readonly-deployments
# Delete the last two documents if your platform manages kube-system and refuses the apply (GKE
# Autopilot's managed namespace). On OpenShift the DNS runs in openshift-dns: apply
# rdy-readonly-openshift-dns.yaml as well.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rdy-readonly-kube-system
  namespace: kube-system
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["kube-dns", "rke2-coredns-rke2-coredns"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["coredns"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rdy-readonly-kube-system
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rdy-readonly-kube-system
subjects:
  - kind: ServiceAccount
    name: rdy-readonly
    namespace: rdy-system
