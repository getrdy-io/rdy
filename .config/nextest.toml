# cargo-nextest settings (docs/plan/08-testing.md, section 1).
# CI runs `cargo nextest run --profile ci`. Locally the default profile applies.

# Oldest nextest that reads these settings. CI pins an exact version in .github/workflows/ci.yml.
nextest-version = "0.9.100"

# trybuild compile-fail tests run a nested `cargo build` of their own. That takes minutes on a slow
# runner (the Intel macOS runner needs about 90 seconds). Convention: the test binary of a trybuild
# test is named `<thing>_guarantee`, for example `loaded_spec_guarantee`. Those binaries get ten
# minutes instead of two, and run one at a time so they do not fight over the target directory.
# Every other test keeps the default limit. Name a new trybuild test binary `*_guarantee`.
[test-groups]
trybuild = { max-threads = 1 }

[profile.ci]
# No retries. A test that fails once in three runs is a bug, and a retry would hide it.
retries = 0
# Run every test so one red test does not hide the others.
fail-fast = false
# A hung test is reported after 30 seconds and killed after two minutes, and it names itself.
slow-timeout = { period = "30s", terminate-after = 4 }

[[profile.ci.overrides]]
filter = 'binary(/_guarantee$/)'
test-group = 'trybuild'
slow-timeout = { period = "60s", terminate-after = 10 }

# The spec parser's property tests (crates/rdy-spec/tests/parse_properties.rs, 08 section 4) run 10,000
# cases in five of their tests, about 5 to 20 seconds each in a debug build on a laptop. A slow runner can
# pass 30 seconds. They get a warning at 60 seconds and are killed at 180. A failure shrinks for at most
# 30 seconds on top of the run (`max_shrink_time`), so a failing run ends with a report and not a kill.
[[profile.ci.overrides]]
filter = 'binary(parse_properties)'
slow-timeout = { period = "60s", terminate-after = 3 }
