# cargo-deny policy. Source: docs/plan/05-threat-model.md, "Dependency policy".
# ADRs: 0001 (YAML parser), 0009 (rustls on ring, no OpenSSL), 0014 (probe facade).
# Run it with `cargo deny check`. Every PR must pass.

[graph]
# Check the targets we ship. Windows and macOS legs get the same policy.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
# The PR gate looks at unmaintained crates in the workspace's own dependencies.
# The daily audit (M2, SEC-02) uses "all" and opens an issue instead of blocking.
unmaintained = "workspace"
yanked = "deny"
# An ignore must name a ticket and expire within 90 days. There are none.
ignore = []

[licenses]
# Never GPL, LGPL, AGPL, SSPL, BUSL or unknown. MPL-2.0 only as a reviewed per-crate
# exception (add it under `exceptions` with the crate name and the review link).
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    # webpki-roots ships Mozilla's root list under this license.
    "CDLA-Permissive-2.0",
]
# Per-crate exceptions. Each names the crate, the one license it may use and the reason.
exceptions = [
    # winx is a Windows-only dependency of cap-primitives (M1-036). Its license is
    # Apache-2.0 WITH LLVM-exception, which only widens what Apache-2.0 allows. Reviewed in 05,
    # "Dependency policy".
    { crate = "winx", allow = ["Apache-2.0 WITH LLVM-exception"] },
]
confidence-threshold = 0.9
# The allowlist is ahead of the dependency tree on purpose. Do not warn about unused entries.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

deny = [
    # TLS is rustls on ring everywhere (ADR 0009, rule 5). No OpenSSL, no platform TLS,
    # no aws-lc. A new ADR lifts the aws-lc ban, not a quiet change (M2 AWS SDK spike).
    { crate = "openssl", reason = "ADR 0009: rustls only" },
    { crate = "openssl-sys", reason = "ADR 0009: rustls only" },
    { crate = "native-tls", reason = "ADR 0009: rustls only" },
    { crate = "hyper-tls", reason = "ADR 0009: rustls only" },
    { crate = "tokio-native-tls", reason = "ADR 0009: rustls only" },
    { crate = "aws-lc-sys", reason = "ADR 0009: ring is the crypto provider" },
    { crate = "aws-lc-rs", reason = "ADR 0009: ring is the crypto provider" },
    # YAML parsers that are archived or unsound (ADR 0001).
    { crate = "serde_yaml", reason = "ADR 0001: deprecated and archived" },
    { crate = "serde_yml", reason = "ADR 0001: RUSTSEC-2025-0068" },
    { crate = "libyml", reason = "ADR 0001: RUSTSEC-2025-0067" },
    # Unmaintained RUSTSEC-2024-0375 and unsound RUSTSEC-2021-0145. Use std::io::IsTerminal.
    { crate = "atty", reason = "RUSTSEC-2024-0375 and RUSTSEC-2021-0145; use std::io::IsTerminal" },
    # The probe facade owns every socket in M1 (ADR 0014). The M2 upload client lifts
    # this with a reviewed change that names the crate that may depend on it.
    { crate = "reqwest", reason = "ADR 0014: the probe facade owns sockets in M1" },
    # The kube client types are on the check-crate deny list (02 Appendix A, ADR 0031). Only the k8s
    # check crate may depend on kube, and kube's own crates only through kube.
    { crate = "kube", wrappers = ["rdy-checks-k8s"], reason = "ADR 0031: only rdy-checks-k8s builds a kube client" },
    { crate = "kube-client", wrappers = ["kube"], reason = "ADR 0031: reached through kube only" },
    { crate = "kube-core", wrappers = ["kube", "kube-client"], reason = "ADR 0031: reached through kube only" },

    # The wall around check crates, second line (02 "Lint wall", ADR 0014 decision 7, M1-044). A check
    # crate reaches the OS only through its Probe. Clippy bans the std items (clippy.toml). Clippy cannot
    # match another crate's items by wildcard, so the crates below stay out of every `rdy-checks-*` crate
    # here: a wrapper is a crate that may depend on the banned one, and no check crate is a wrapper. The
    # exceptions are named below. The test is tests/lint-wall/tests/deny_wrappers.rs.
    # To let a new crate use one of these, add it to `wrappers` with a review. Never add a check crate.
    { crate = "socket2", wrappers = ["hyper-util", "rdy-engine", "tokio"], reason = "02 lint wall: raw sockets are the probe facade's; rdy-engine sets a zero linger in its `loopback` test servers only, ADR 0035 (tests/lint-wall names the type behind an optional feature that deny does not enable)" },
    { crate = "walkdir", reason = "02 lint wall: a directory walk goes through Probe::read_dir (jni, an Android-only build dependency of kube, is not a shipped target)" },
    { crate = "sysinfo", reason = "02 lint wall: machine facts go through the probe" },
    { crate = "which", reason = "02 lint wall: a program is resolved by the command table" },
    { crate = "ureq", reason = "02 lint wall: HTTP goes through the probe facade" },
    { crate = "hickory-resolver", reason = "02 lint wall: DNS goes through the probe facade" },
    { crate = "hickory-proto", reason = "02 lint wall: DNS goes through the probe facade" },
    { crate = "hickory-client", reason = "02 lint wall: DNS goes through the probe facade" },
    { crate = "hickory-net", reason = "02 lint wall: DNS goes through the probe facade" },
    { crate = "nix", wrappers = ["rexpect"], reason = "02 lint wall: rexpect drives the prompt tests (dev only); no check crate" },
    { crate = "hyper", wrappers = ["hyper-rustls", "hyper-timeout", "hyper-util", "kube-client", "rdy-engine"], reason = "02 lint wall: the kube client stack reaches it; rdy-engine uses it for the facade's HTTP/1.1 probe (M1-093, ADR 0014 decision 4)" },
    { crate = "rustix", wrappers = ["cap-primitives", "cap-std", "fs-set-times", "rdy", "rdy-engine", "rustix-linux-procfs", "tempfile"], reason = "02 lint wall: safe syscall wrappers belong to the engine and the CLI, not to a check" },
    # The k8s check crate has two dev-dependencies that the wall would otherwise ban. Both are test only
    # (a local TLS server and kubeconfig files for the client tests). deny cannot tell a dev-dependency
    # from a normal one, so the name is listed here. tests/lint-wall/tests/deps_allowlist.rs tells them
    # apart: it fails if either is anything but a dev-dependency of rdy-checks-k8s.
    { crate = "tempfile", wrappers = ["rdy", "rdy-checks-k8s", "rdy-engine", "rexpect", "xtask"], reason = "02 lint wall: file creation is not a check's; rdy-checks-k8s uses it in tests only" },
    { crate = "tokio-rustls", wrappers = ["hyper-rustls", "rdy-checks-k8s", "rdy-engine"], reason = "02 lint wall: TLS goes through the probe or kube; rdy-checks-k8s uses it in its test server only; rdy-engine uses it for the facade's TLS (M1-092) and in its `loopback` test servers (ADR 0035)" },
    # askama builds the HTML report (M1-077, 05 dependency record, SEC-149-2). Only the engine renders a
    # report. A check crate never needs a template engine, so it stays off every check crate.
    { crate = "askama", wrappers = ["rdy-engine"], reason = "05 dependency record: only rdy-engine renders the HTML report; no check crate" },
    { crate = "askama_macros", wrappers = ["askama"], reason = "05 dependency record: reached through askama only" },
    { crate = "askama_derive", wrappers = ["askama_macros"], reason = "05 dependency record: reached through askama only" },
    { crate = "askama_parser", wrappers = ["askama_derive"], reason = "05 dependency record: reached through askama only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
