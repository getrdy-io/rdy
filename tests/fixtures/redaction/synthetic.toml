# Synthetic secrets for the redaction corpus (04 section 4, M1-063).
#
# Every value here is made up. Each is stored as parts, so push protection and secret scanners never see a
# whole token in the repo. A case writes `${SYN:name}` in its `.in` and in its `secrets`, and the harness
# joins the parts. The vendor-documented `AKIAIOSFODNN7EXAMPLE` is the one value used as it is.
#
# `.expected` files never use `${SYN:..}`: they hold placeholders and the text around them, and the harness
# compares them byte for byte. A part that no case uses fails the gate, so the list cannot go stale.

