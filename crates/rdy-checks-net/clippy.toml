# The lint wall of rdy-checks-net (INV-07, docs/plan/02-engine-design.md Appendix A, ADR 0014 decision 7, M1-044).
#
# A check crate reaches the machine only through its `Probe`. These exact items are banned here, so a
# check that opens a file, runs a program, opens a socket, starts a thread or reads the environment
# fails `cargo clippy -D warnings`. Entries are exact paths, never wildcards. A type entry covers every
# constructor and method reached by naming the type. The method entries stay as a second line, so the
# wall does not hinge on one clippy rule.
#
# A crate's own clippy.toml replaces the root file, so the root entries are repeated in
# `disallowed-methods`, with `allow-invalid` for the paths of crates this crate does not depend on.
# Keep this file in step with ../../clippy.toml and with the other check crates.
# tests/lint-wall/tests/clippy_wall.rs fails on drift, and on any entry that no use in
# tests/lint-wall/src/uses.rs triggers. Paths that do not exist on every OS or in every crate carry
# `allow-invalid = true`.
# `allow(clippy::disallowed_` is legal only in the k8s client module (tests/lint-wall/tests/allow_grep.rs).

allow-unwrap-in-tests = true
allow-expect-in-tests = true

disallowed-types = [
    # Process.
    { path = "std::process::Command", reason = "a check runs a command only through Probe::exec, which logs it and applies the check's declaration (ADR 0014)" },
    # Files and directories.
    { path = "std::fs::File", reason = "a check reads files only through Probe::read, read_dir and stat (ADR 0014)" },
    { path = "std::fs::OpenOptions", reason = "a check reads files only through Probe::read, read_dir and stat (ADR 0014)" },
    { path = "std::fs::DirBuilder", reason = "a check reads files only through Probe::read, read_dir and stat (ADR 0014)" },
    # Sockets.
    { path = "std::net::TcpStream", reason = "a check reaches the network only through the probe tcp, tls and http methods (ADR 0014)" },
    { path = "std::net::TcpListener", reason = "a check reaches the network only through the probe tcp, tls and http methods (ADR 0014)" },
    { path = "std::net::UdpSocket", reason = "a check reaches the network only through the probe tcp, tls and http methods (ADR 0014)" },
    # Sockets (Unix only).
    { path = "std::os::unix::net::UnixStream", reason = "a check reaches the network only through the probe tcp, tls and http methods (ADR 0014)", allow-invalid = true },
    { path = "std::os::unix::net::UnixListener", reason = "a check reaches the network only through the probe tcp, tls and http methods (ADR 0014)", allow-invalid = true },
    { path = "std::os::unix::net::UnixDatagram", reason = "a check reaches the network only through the probe tcp, tls and http methods (ADR 0014)", allow-invalid = true },
    # Sockets (`socket2` is not a dependency of a check crate: cargo deny is the first line, this is the second).
    { path = "socket2::Socket", reason = "a check reaches the network only through the probe tcp, tls and http methods (ADR 0014)", allow-invalid = true },
    # Threads and tasks.
    { path = "std::thread::Builder", reason = "a check never starts a thread or task of its own; use rdy_engine::blocking (ADR 0014)" },
    # First-party escapes: the watchdog and the live process count (PC-48).
    { path = "rdy_engine::watchdog::ProcessEffects", reason = "the run owns the watchdog; a check never ends the process, kills a group or starts a thread of its own (ADR 0016)", allow-invalid = true },
    # askama prints a value without escaping it through these (M1-078). Only the marker on EmbeddedJson in rdy-engine's report/html/view.rs may.
    { path = "askama::filters::Safe", reason = "prints a value without escaping; only the EmbeddedJson marker in report/html/view.rs may switch escaping off", allow-invalid = true },
    { path = "askama::filters::Unsafe", reason = "wraps a value for the escaper; use askama's default escaping", allow-invalid = true },
    { path = "askama::filters::MaybeSafe", reason = "marks filter output as maybe unescaped; escaping stays on", allow-invalid = true },
    { path = "askama::filters::HtmlSafe", reason = "marks a type as printed without escaping; only EmbeddedJson in report/html/view.rs may impl it (held by scripts/check-html-escapes.sh)", allow-invalid = true },
    { path = "askama::filters::HtmlSafeOutput", reason = "marks filter output as HTML safe; escaping stays on", allow-invalid = true },
]

