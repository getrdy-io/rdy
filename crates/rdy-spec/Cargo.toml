[package]
name = "rdy-spec"
version = "0.1.0-alpha.0"
description = "The rdy/v1 spec and result formats, signature checks and JSON schemas."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
include = ["src/**", "Cargo.toml", "LICENSE"]

[dependencies]
blake2 = { workspace = true }
ed25519-dalek = { workspace = true }
schemars = { workspace = true, features = ["derive", "std", "preserve_order"] }
serde = { workspace = true, features = ["std", "derive"] }
serde-saphyr = { workspace = true, features = ["deserialize"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
jsonschema = { workspace = true }
minisign = { workspace = true }
proptest = { workspace = true, features = ["std"] }
trybuild = { workspace = true }

[lints]
workspace = true
