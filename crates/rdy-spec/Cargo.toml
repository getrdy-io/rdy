[package]
name = "rdy-spec"
version = "0.1.0-alpha.0"
description = "The rdy/v1 spec and result formats, signature checks and JSON schemas."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
include = ["src/**", "Cargo.toml", "LICENSE"]

[dependencies]
blake2 = { workspace = true }
ed25519-dalek = { workspace = true }
schemars = { workspace = true, optional = true, features = ["derive", "std", "preserve_order"] }
serde = { workspace = true, features = ["std", "derive"] }
serde-saphyr = { workspace = true, features = ["deserialize"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
# The schema tests and the unit tests of the schema module need the feature.
rdy-spec = { path = ".", features = ["schema"] }
jsonschema = { workspace = true }
minisign = { workspace = true }
proptest = { workspace = true, features = ["std"] }
trybuild = { workspace = true }

[features]
# The JSON schema generator. Off by default so schemars and serde_json/preserve_order stay out of the
# binary and out of the library that rdy-cloud reads. xtask turns it on (ADR 0019).
schema = ["dep:schemars"]

[lints]
workspace = true
