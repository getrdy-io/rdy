[package]
name = "rdy-checks-host"
version = "0.1.0-alpha.0"
description = "Host checks for rdy: CPU, memory, disk, ports and OS. Internal to rdy."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
include = ["src/**", "Cargo.toml", "LICENSE", "clippy.toml"]

[dependencies]
rdy-spec = { path = "../rdy-spec", version = "0.1.0-alpha.0" }
rdy-engine = { path = "../rdy-engine", version = "0.1.0-alpha.0" }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
# The test run (`TestRun`) applies the real read policy and writes the real action log (M1-147).
rdy-engine = { path = "../rdy-engine", version = "0.1.0-alpha.0", features = ["testing"] }
tokio = { workspace = true, features = ["rt", "test-util", "time"] }
# Parsers of external text never panic on arbitrary bytes (08 Appendix E).
proptest = { workspace = true, features = ["std"] }

[lints]
workspace = true
