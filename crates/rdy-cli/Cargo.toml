[package]
name = "rdy"
version = "0.1.0-alpha.0"
description = "Check an environment against a vendor's requirements before install day."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["readiness", "diagnostics", "preflight", "kubernetes", "on-prem"]
categories = ["command-line-utilities"]
# The package is `rdy`, the directory is `crates/rdy-cli` (ADR 0011).
build = "build.rs"
include = ["src/**", "/build.rs", "/build_version.rs", "Cargo.toml", "LICENSE", "NOTICE"]

[lib]
name = "rdy_cli"
path = "src/lib.rs"

[[bin]]
name = "rdy"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true, features = ["std"] }
anstream = { workspace = true, features = ["auto", "wincon"] }
blake2 = { workspace = true }
clap = { workspace = true, features = ["std", "derive", "help", "usage", "error-context", "env"] }
ct-codecs = { workspace = true }
ed25519-dalek = { workspace = true, features = ["zeroize"] }
getrandom = { workspace = true }
indicatif = { workspace = true }
rdy-checks-host = { path = "../rdy-checks-host", version = "0.1.0-alpha.0" }
rdy-checks-net = { path = "../rdy-checks-net", version = "0.1.0-alpha.0" }
rdy-checks-k8s = { path = "../rdy-checks-k8s", version = "0.1.0-alpha.0" }
rdy-engine = { path = "../rdy-engine", version = "0.1.0-alpha.0" }
rdy-spec = { path = "../rdy-spec", version = "0.1.0-alpha.0" }
scrypt = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "signal", "macros", "time"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["std", "fmt", "env-filter", "registry"] }
unicode-width = { workspace = true }
zeroize = { workspace = true }

# Windows reads a hidden password through rpassword. Unix does its own termios work (prompt.rs).
[target.'cfg(not(unix))'.dependencies]
console = { workspace = true }
rpassword.workspace = true

# `GetFileType` through a safe wrapper: a spec or key file must be a disk file (M1-183). No `unsafe` here.
[target.'cfg(windows)'.dependencies]
winapi-util = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["std", "fs", "process", "termios"] }

[dev-dependencies]
jsonschema = { workspace = true }
minisign = { workspace = true }
proptest = { workspace = true, features = ["std"] }
# The env harness (M1-075) runs the real host family over fixture environments, in process. `rdy run`
# will depend on the families for real in M1-057.
rdy-checks-host = { path = "../rdy-checks-host", version = "0.1.0-alpha.0" }
rdy-checks-net = { path = "../rdy-checks-net", version = "0.1.0-alpha.0" }
# `testing` serves a scripted cluster from an env's `api/` tree (M1-185). It is a dev-dependency feature, so
# the shipped binary never has it: a release build with it does not compile, and the CI guard on the normal
# build graph keeps it out.
rdy-checks-k8s = { path = "../rdy-checks-k8s", version = "0.1.0-alpha.0", features = ["testing"] }
# `testing` adds the panicking-redactor seam. It is a dev-dependency feature, so the shipped binary
# never has it (rdy-engine refuses a release build with it). `loopback` adds the TLS server and the
# generated CA that the env harness builds its certificate chains from (M1-100, ADR 0035); the CI guard
# on the normal build graph keeps it out of the binary.
rdy-engine = { path = "../rdy-engine", version = "0.1.0-alpha.0", features = ["testing", "loopback"] }
# The docs-test runner (M1-136) matches each tested block's output against the regex it declares.
regex = { workspace = true, features = ["std", "perf", "unicode"] }
sha2 = { workspace = true, features = ["std"] }
tempfile = { workspace = true }
# `test-util` gives the harness a paused clock, so a hung source costs no real time.
tokio = { workspace = true, features = ["rt", "macros", "net", "time", "test-util", "io-util"] }

[target.'cfg(unix)'.dev-dependencies]
rexpect.workspace = true

# A named pipe server for the Windows spec-read test (M1-183).
[target.'cfg(windows)'.dev-dependencies]
tokio = { workspace = true, features = ["rt", "net"] }

[lints]
workspace = true
