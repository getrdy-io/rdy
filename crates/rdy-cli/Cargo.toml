[package]
name = "rdy"
version = "0.1.0-alpha.0"
description = "Check an environment against a vendor's requirements before install day."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["readiness", "diagnostics", "preflight", "kubernetes", "on-prem"]
categories = ["command-line-utilities"]
# The package is `rdy`, the directory is `crates/rdy-cli` (ADR 0011).
build = "build.rs"
include = ["src/**", "/build.rs", "/build_version.rs", "Cargo.toml", "LICENSE"]

[lib]
name = "rdy_cli"
path = "src/lib.rs"

[[bin]]
name = "rdy"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true, features = ["std"] }
blake2 = { workspace = true }
clap = { workspace = true, features = ["std", "derive", "help", "usage", "error-context", "env"] }
ct-codecs = { workspace = true }
ed25519-dalek = { workspace = true, features = ["zeroize"] }
getrandom = { workspace = true }
rdy-engine = { path = "../rdy-engine", version = "0.1.0-alpha.0" }
rdy-spec = { path = "../rdy-spec", version = "0.1.0-alpha.0" }
scrypt = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["std", "fmt", "env-filter", "registry"] }
zeroize = { workspace = true }

# Windows reads a hidden password through rpassword. Unix does its own termios work (prompt.rs).
[target.'cfg(not(unix))'.dependencies]
rpassword.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["std", "fs", "process", "termios"] }

[dev-dependencies]
jsonschema = { workspace = true }
minisign = { workspace = true }
# `testing` adds the panicking-redactor seam. It is a dev-dependency feature, so the shipped binary
# never has it (rdy-engine refuses a release build with it).
rdy-engine = { path = "../rdy-engine", version = "0.1.0-alpha.0", features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[target.'cfg(unix)'.dev-dependencies]
rexpect.workspace = true

[lints]
workspace = true
