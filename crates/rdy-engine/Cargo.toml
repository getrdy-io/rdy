[package]
name = "rdy-engine"
version = "0.1.0-alpha.0"
description = "The rdy check engine: scheduler, result model and report renderers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
include = ["src/**", "Cargo.toml", "LICENSE"]

[features]
default = ["runtime"]
# The scheduler, the blocking helper, the process runner and their dependencies (02, "Crate layout").
runtime = ["dep:tokio", "dep:rustix"]

[dependencies]
rdy-spec = { path = "../rdy-spec", version = "0.1.0-alpha.0" }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"], optional = true }

# Process group kill on Unix (M1-038). Safe wrappers, so the crate keeps `forbid(unsafe_code)`.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["std", "process"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = { workspace = true }

[lints]
workspace = true
