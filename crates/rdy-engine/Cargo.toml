[package]
name = "rdy-engine"
version = "0.1.0-alpha.0"
description = "The rdy check engine: scheduler, result model and report renderers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
include = ["src/**", "Cargo.toml", "LICENSE"]

[features]
# Test-only helpers (`TagKey::fixed`) and the replay backend with its fixture loader (M1-049). A release
# build with this feature does not compile (see `rdy_engine::redact`). CI also keeps it out of the release
# binary (04 section 3.3). `toml` reads `fixture.toml` and is in no other engine build.
testing = ["dep:toml"]
# Loopback servers for the network tests (M1-090, ADR 0035): a TLS server with a generated CA, CONNECT
# proxy modes, a closed port, a listener that never accepts, a reset after the ClientHello, a 302 server
# and a dual-stack case. Test-only like `testing`, which it implies. It needs tokio for sockets but not
# the `runtime` feature, so the build without default features still compiles and lints it.
loopback = ["testing", "dep:tokio", "dep:rcgen", "dep:socket2", "dep:tokio-rustls"]

default = ["runtime"]
# The scheduler, the blocking helper, the process runner and their dependencies (02, "Crate layout").
runtime = ["dep:tokio", "dep:rustix", "dep:cap-std", "dep:cap-primitives"]

[dependencies]
rdy-spec = { path = "../rdy-spec", version = "0.1.0-alpha.0" }
cap-std = { workspace = true, optional = true }
regex = { workspace = true, features = ["std", "perf", "unicode"] }
ring = { workspace = true, features = ["alloc"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"], optional = true }
toml = { workspace = true, features = ["parse", "serde", "std"], optional = true }
# Feature `loopback` only. Certificates are made with rcgen on ring and served with tokio-rustls on ring,
# so aws-lc stays out of the tree (ADR 0009). socket2 sets a zero linger for the reset server.
rcgen = { workspace = true, features = ["crypto", "pem", "ring"], optional = true }
socket2 = { workspace = true, features = [], optional = true }
tokio-rustls = { workspace = true, features = ["ring", "tls12"], optional = true }

# Windows opens the report folder without following a reparse point (M1-036, M1-037).
[target.'cfg(not(unix))'.dependencies]
cap-primitives = { workspace = true, optional = true }

# Process group kill (M1-038) and the umask (M1-039) on Unix. Safe wrappers, so the crate keeps `forbid(unsafe_code)`.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["std", "process", "fs", "system"], optional = true }

[dev-dependencies]
# The integration tests start commands through the raw runner (`exec::run`, `ExecSpec::new`), which
# is public only under `testing` (M1-039). A dev-dependency on the crate itself turns the feature on
# for test builds only. A normal or release build never sees dev-dependencies.
rdy-engine = { path = ".", features = ["testing", "loopback"] }
jsonschema = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = { workspace = true }
proptest = { workspace = true, features = ["std"] }
trybuild = { workspace = true }
# The fixture lint (tests/fixture_lint.rs) reads allow.toml and the `crlf` list of fixture.toml.
toml = { workspace = true, features = ["parse", "std"] }

[lints]
workspace = true
