[package]
name = "rdy-engine"
version = "0.1.0-alpha.0"
description = "The rdy check engine: scheduler, result model and report renderers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
include = ["src/**", "Cargo.toml", "LICENSE"]

[features]
default = ["runtime"]
# The scheduler and its tokio dependency (02, "Crate layout").
runtime = ["dep:tokio"]

[dependencies]
rdy-spec = { path = "../rdy-spec", version = "0.1.0-alpha.0" }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "sync", "time"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
