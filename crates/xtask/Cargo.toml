[package]
name = "xtask"
version = "0.0.0"
description = "Repo tasks for rdy: generated docs, the schema, the docs lint and the check list. Not published."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Repo tool. It never goes to crates.io (docs/plan/09-docs-site.md, section 2).
publish = false

# dist must not treat this binary as an app to package (docs/plan/06-release-and-distribution.md).
[package.metadata.dist]
dist = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true, features = ["std"] }
clap = { workspace = true, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
rdy-checks-host = { path = "../rdy-checks-host", version = "0.1.0-alpha.0" }
# A guard, not a saving: rdy-checks-host turns `runtime` on today, so this changes nothing yet. xtask
# reads only `CheckInfo` and the registry, and asks for no more of the engine than that.
rdy-engine = { path = "../rdy-engine", version = "0.1.0-alpha.0", default-features = false }
rdy-spec = { path = "../rdy-spec", version = "0.1.0-alpha.0", features = ["schema"] }
# Writes each example as YAML, and reads it back to check that it says the same thing.
serde-saphyr = { workspace = true, features = ["serialize", "deserialize"] }
# preserve_order keeps the schema field order, so the spec table lists fields as the types declare them.
serde_json = { workspace = true, features = ["std", "preserve_order"] }
sha2 = { workspace = true, features = ["std"] }
unicode-normalization = { workspace = true, features = ["std"] }

[dev-dependencies]
tempfile = { workspace = true }
# The test that checks every spec example runs it with the validator rdy-spec uses. It is a dev
# dependency because a normal dependency on it fails the cargo-deny license policy (ADR 0034).
jsonschema = { workspace = true }

[lints]
workspace = true
