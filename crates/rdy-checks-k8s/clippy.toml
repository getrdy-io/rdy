# The kube entries of the lint wall (docs/plan/02-engine-design.md, Appendix A, and ADR 0031).
#
# Outside `src/client/`, check code must not name a kube client or config type or call a constructor of
# one. Only the client module builds a client, so every request goes through the read-only guard that
# M1-103 puts in `build_client`. `src/client/mod.rs` allows `clippy::disallowed_types` and
# `clippy::disallowed_methods` for itself, and nowhere else may.
#
# Re-checked on 2026-10-29 against kube 4.2.0 (the pinned version, from the crate source): every item
# below exists. If a kube bump renames or removes one, clippy says so with a warning, and `-D warnings`
# fails the build. `kube::client::Client` and `kube::config::Config` are re-exports of the same items as
# `kube::Client` and `kube::Config`, and clippy matches the item, so one entry covers both paths.
# A type entry covers every constructor and trait route reached by naming the type:
# `TryFrom<Config>` and `TryFrom<Kubeconfig>` for `Client`, `TryFrom<Config>` for `ClientBuilder`,
# `TryFrom<Kubeconfig>` for `Config`, and `Default` and `Deserialize` for `Kubeconfig`. The method entries stay as a second line.
#
# M1-044 merged the std and facade entries of Appendix A into this file. M1-107 carries the proof that the
# kube entries bite, from `lint-wall/kube-use.rs.txt` (it uses all 18 entries, the trait routes and both
# re-export paths; it is not compiled by default).
#
# A crate's own clippy.toml replaces the root file, so everything the root file says is repeated here.
# Keep this file in step with ../../clippy.toml (tests/lint-wall/tests/clippy_wall.rs checks it).
#
# The std and facade entries below are the check-crate wall (M1-044). It is the same list as in the other
# check crates. tests/lint-wall/tests/clippy_wall.rs fails on drift against them, and on any non-kube entry
# that no use in tests/lint-wall/src/uses.rs triggers. Paths that do not exist on every OS or in every
# crate carry `allow-invalid = true`.
# `allow(clippy::disallowed_` is legal only in `src/client/` and the client tests (tests/lint-wall/tests/allow_grep.rs).
#
# The test settings:
allow-unwrap-in-tests = true
allow-expect-in-tests = true

disallowed-types = [
    # Kube, outside src/client/.
    { path = "kube::Client", reason = "only src/client/ builds a client; checks get the guarded ReadOnlyClient (ADR 0010)" },
    { path = "kube::Config", reason = "only src/client/ builds a kube config (ADR 0010)" },
    { path = "kube::client::ClientBuilder", reason = "only src/client/ builds a client; the guard layer goes in build_client (ADR 0010)" },
    { path = "kube::config::Kubeconfig", reason = "only src/client/ reads a kubeconfig; the probe facade denies .kube (ADR 0031)" },
    # Process.
    { path = "std::process::Command", reason = "a check runs a command only through Probe::exec, which logs it and applies the check's declaration (ADR 0014)" },
    # Files and directories.
    { path = "std::fs::File", reason = "a check reads files only through Probe::read, read_dir and stat (ADR 0014)" },
    { path = "std::fs::OpenOptions", reason = "a check reads files only through Probe::read, read_dir and stat (ADR 0014)" },
    { path = "std::fs::DirBuilder", reason = "a check reads files only through Probe::read, read_dir and stat (ADR 0014)" },
    # Sockets.
    { path = "std::net::TcpStream", reason = "a check reaches the network only through the probe tcp, tls and http methods (ADR 0014)" },
    { path = "std::net::TcpListener", reason = "a check reaches the network only through the probe tcp, tls and http methods (ADR 0014)" },
    { path = "std::net::UdpSocket", reason = "a check reaches the network only through the probe tcp, tls and http methods (ADR 0014)" },
    # Sockets (Unix only).
    { path = "std::os::unix::net::UnixStream", reason = "a check reaches the network only through the probe tcp, tls and http methods (ADR 0014)", allow-invalid = true },
    { path = "std::os::unix::net::UnixListener", reason = "a check reaches the network only through the probe tcp, tls and http methods (ADR 0014)", allow-invalid = true },
    { path = "std::os::unix::net::UnixDatagram", reason = "a check reaches the network only through the probe tcp, tls and http methods (ADR 0014)", allow-invalid = true },
    # Sockets (`socket2` is not a dependency of a check crate: cargo deny is the first line, this is the second).
    { path = "socket2::Socket", reason = "a check reaches the network only through the probe tcp, tls and http methods (ADR 0014)", allow-invalid = true },
    # Threads and tasks.
    { path = "std::thread::Builder", reason = "a check never starts a thread or task of its own; use rdy_engine::blocking (ADR 0014)" },
    # First-party escapes: the watchdog and the live process count (PC-47).
    { path = "rdy_engine::watchdog::ProcessEffects", reason = "the run owns the watchdog; a check never ends the process, kills a group or starts a thread of its own (ADR 0016)", allow-invalid = true },
]

