[package]
name = "rdy-checks-k8s"
version = "0.1.0-alpha.0"
description = "Kubernetes checks for rdy: version, storage classes, RBAC and nodes. Internal to rdy."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
include = ["src/**", "Cargo.toml", "LICENSE", "clippy.toml"]

[dependencies]
rdy-engine = { path = "../rdy-engine", version = "0.1.0-alpha.0" }
# Only `client` and `rustls-tls`, plus `ring` so rustls has a crypto provider and `aws-lc-rs` stays out
# (ADR 0009, ADR 0031). No `runtime`, `derive`, `ws`, `oauth`, `oidc`, `http-proxy` or `socks5`.
kube = { workspace = true, features = ["client", "rustls-tls", "ring"] }
# The newest `v1_*` minor, set once here (ADR 0010).
k8s-openapi = { workspace = true, features = ["std", "v1_36"] }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
rcgen = { workspace = true, features = ["crypto", "pem", "ring"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }

[lints]
workspace = true
