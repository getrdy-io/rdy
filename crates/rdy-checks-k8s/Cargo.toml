[package]
name = "rdy-checks-k8s"
version = "0.1.0-alpha.0"
description = "Kubernetes checks for rdy: version, storage classes, RBAC and nodes. Internal to rdy."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
include = ["src/**", "data/**", "Cargo.toml", "LICENSE", "clippy.toml"]

[dependencies]
rdy-engine = { path = "../rdy-engine", version = "0.1.0-alpha.0" }
# The typed parameters of the checks (`K8sVersion`, `K8sAccess`, `K8sStorageClass` and their scalars) and the
# pattern compiler.
rdy-spec = { path = "../rdy-spec", version = "0.1.0-alpha.0" }
# Only `client` and `rustls-tls`, plus `ring` so rustls has a crypto provider and `aws-lc-rs` stays out
# (ADR 0009, ADR 0031). `webpki-roots` makes the bundled roots the only system roots: without it kube
# defers to rustls-platform-verifier when a kubeconfig has no CA, which ADR 0014 decision 3 bans. The
# crate stays in the tree but nothing reaches it (ADR 0031 decision 9). `http-proxy` is the CONNECT tunnel
# for an `http://` proxy (ADR 0037); it adds no crate that is not in the tree already. No `runtime`,
# `derive`, `ws`, `oauth`, `oidc` or `socks5`.
kube = { workspace = true, features = ["client", "rustls-tls", "ring", "webpki-roots", "http-proxy"] }
# The newest `v1_*` minor, set once here (ADR 0010).
k8s-openapi = { workspace = true, features = ["std", "v1_36"] }
secrecy = { workspace = true, features = [] }
# The read-only guard is a tower layer (M1-103). The request, body and service types it names.
http = { workspace = true, features = ["std"] }
http-body = { workspace = true, features = [] }
tower-layer = { workspace = true, features = [] }
tower-service = { workspace = true, features = [] }
thiserror = { workspace = true, features = ["std"] }
# A finding's `observed` and `expected` are JSON values, and the `exp` claim of a static JWT token is read
# with it; nothing else of the token is.
serde_json = { workspace = true, features = ["std"] }
# Reads `data/provisioners.toml`, the storage provisioner table embedded at build time (M1-110, 03
# Appendix B). `toml` parses text that `include_str!` put in the binary and touches no file.
serde = { workspace = true, features = ["std", "derive"] }
toml = { workspace = true, features = ["parse", "serde", "std"] }

[dev-dependencies]
# The test run (`TestRun`) writes the real action log, so the guard tests read the entries a run would.
rdy-engine = { path = "../rdy-engine", version = "0.1.0-alpha.0", features = ["testing"] }
serde-saphyr = { workspace = true, features = ["deserialize"] }
rcgen = { workspace = true, features = ["crypto", "pem", "ring"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
tracing = { workspace = true, features = ["std"] }
log = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["fmt", "std", "tracing-log"] }

[lints]
workspace = true
