# The network plugin table behind k8s.cni (M1-165, docs/plan/03-check-catalog.md Appendix B).
#
# k8s.cni names the plugin from three signals, cheapest first: the NetworkUnavailable reason a node
# reports, the API groups the cluster serves, then one DaemonSet read by name. This table says which
# signal means which plugin, and whether the plugin enforces NetworkPolicy.
#
# [[cni]]
#   id            short id, lower case. Unique.
#   name          the name the report shows.
#   family        plugins of one family are the same plugin to the check: GKE Dataplane V2 (anetd) is Cilium,
#                 and `rke2-cilium` is Cilium. Two families together are an ambiguous answer, except Flannel
#                 with Calico, which is Canal (the "canal" entry, found by its DaemonSet, is its own family
#                 and is also what the pair resolves to).
#   node_reasons  reasons of the node condition NetworkUnavailable that name the plugin. `RouteCreated` is the
#                 cloud route controller and names no plugin, so it is not here.
#   crd_groups    API groups the plugin installs. Read from `GET /apis`, never from CustomResourceDefinition
#                 objects.
#   network_types OpenShift `Network` `status.networkType` values, which name the plugin on OpenShift.
#   daemonsets    "namespace/name" of the node agent DaemonSet, read by name when no cheaper signal named the
#                 plugin. At most 4 per entry. The guard (`ALLOWED`) and examples/rbac/rdy-readonly-cni.yaml
#                 list the same pairs, and a test holds the three in step.
#   enforces      "yes": the plugin enforces NetworkPolicy. "no": it does not (Flannel alone). "env": it does
#                 when a setting on its DaemonSet says so (the AWS VPC CNI, `ENABLE_NETWORK_POLICY`).
#   pod_cidr      "node": the pod ranges are the `spec.podCIDRs` of the nodes. "own": the plugin allocates
#                 pod addresses from its own pool (a Calico IPPool, a Cilium cluster pool, the VPC), so the
#                 node field says nothing.
#   source        https URL of the public page the entry came from.
#   checked_on    YYYY-MM-DD, the day someone read that page.
#
# The file holds no free text. The check prints fixed words and the names it finds.

schema = 1

[[cni]]
id = "calico"
name = "Calico"
family = "calico"
node_reasons = ["CalicoIsUp"]
crd_groups = ["crd.projectcalico.org", "projectcalico.org"]
network_types = []
daemonsets = ["kube-system/calico-node", "calico-system/calico-node"]
enforces = "yes"
pod_cidr = "own"
source = "https://docs.tigera.io/calico/latest/about"
checked_on = "2026-11-17"

