[workspace]
resolver = "3"
members = [
    "crates/rdy-spec",
    "crates/rdy-engine",
    "crates/rdy-checks-host",
    "crates/rdy-checks-net",
    "crates/rdy-checks-k8s",
    "crates/rdy-cli",
    "crates/xtask",
    "tests/lint-wall",
]

# Crates enter the workspace when their milestone starts (docs/plan/00-overview.md).
# rdy-bundle is M2, rdy-checks-cloud is M3, rdy-checks-gpu is M4.
# xtask is the repo task runner (cargo xtask). It is never published.

[workspace.package]
edition = "2024"
# Stable minus two minors (docs/plan/06-release-and-distribution.md). A CI job enforces it from M2.
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/getrdy-io/rdy"
homepage = "https://getrdy.io"
# There is no shared `version`. Versions are per crate (ADR 0007).

[workspace.dependencies]
# Each ticket adds the lines it needs. Nothing is listed ahead of use.
# Default features are off. The crate that uses a dependency names its features.
anyhow = { version = "1", default-features = false }
clap = { version = "4.6", default-features = false }
jsonschema = { version = "0.60", default-features = false }
schemars = { version = "1", default-features = false }
serde = { version = "1", default-features = false }
serde-saphyr = { version = "~2.0", default-features = false }
serde_json = { version = "1", default-features = false }
trybuild = "1"
thiserror = { version = "2", default-features = false }
# HMAC-SHA256 tags and the per-run key for the redactor (ADR 0009, ADR 0015). No aws-lc.
ring = { version = "0.17", default-features = false }
# Linear-time matching for the redaction rules (04 section 3.4).
regex = { version = "1", default-features = false }
# The parsed form of a pattern, to read the shortest text it can match (01 section 2.8).
regex-syntax = { version = "0.8", default-features = false }
# The scheduler (M1-034). Each crate names the features it uses.
tokio = { version = "1", default-features = false }
rpassword = { version = "7.5", default-features = false }
# Pseudo-terminal driver for the prompt tests (M1-123). Test-only, Unix only.
rexpect = { version = "0.7", default-features = false }
sha2 = { version = "0.10", default-features = false }
tempfile = { version = "3", default-features = false }
unicode-normalization = { version = "0.1", default-features = false }
# Safe wrappers over open flags and geteuid, so the password file checks need no unsafe (M1-112).
rustix = { version = "1", default-features = false }
# Output directory confinement (M1-036, ADR 0016). Version 3.4.1 or later fixes RUSTSEC-2024-0445.
cap-std = { version = "4.0.3", default-features = false }
cap-primitives = { version = "4.0.3", default-features = false }
# Key passwords are wiped from memory on drop (M1-112). `alloc` gives the String impl.
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# Spec signature checks (M1-120, ADR 0018). Exact pins: every bump is reviewed by hand.
ed25519-dalek = { version = "=2.2.0", default-features = false }
blake2 = { version = "=0.10.6", default-features = false }
# Secret key files and signing (M1-125, ADR 0022). `scrypt` and `ct-codecs` are the crates stock minisign
# tooling in Rust uses for the same format. `getrandom` makes the keys. Exact pins (ADR 0018): they touch
# secret bytes, so every bump is reviewed by hand.
scrypt = { version = "=0.11.0", default-features = false }
ct-codecs = { version = "=1.1.8", default-features = false, features = ["std"] }
getrandom = { version = "=0.4.3", default-features = false }
# Test-only: signs synthetic specs the way stock minisign does, and generates property-test cases.
minisign = { version = "=0.10.0", default-features = false }
# 1.5 is the first release with a fixed seed (docs/plan/08-testing.md section 4).
proptest = { version = "1.5", default-features = false }

# The Kubernetes client (M1-102, ADR 0010 and ADR 0031). Exact pins: the kube client and config types are
# on the check-crate deny list (02 Appendix A), and that list was checked against this version, so every
# bump is reviewed by hand. kube 4.2.0 depends on k8s-openapi 0.28, so they move together.
kube = { version = "=4.2.0", default-features = false }
k8s-openapi = { version = "=0.28.0", default-features = false }
# Token and key values of a kubeconfig, read only to hand them to the known-secret set (M1-102, M1-061).
# Already in the tree through kube; the version is the one kube-client uses.
secrecy = { version = "0.10", default-features = false }
# The read-only guard is a tower layer on the kube client's service (M1-103, ADR 0010). These four are
# the types it names: requests and bodies (`http`, `http-body`) and the service traits. All are in the
# tree already through kube; the versions are the ones kube-client uses.
http = { version = "1", default-features = false }
http-body = { version = "1", default-features = false }
tower-layer = { version = "0.3", default-features = false }
tower-service = { version = "0.3", default-features = false }
# Test-only: a TLS server with a throwaway CA for the client tests (M1-102). Both on ring, never aws-lc.
rcgen = { version = "0.14", default-features = false }
tokio-rustls = { version = "0.26", default-features = false }

# Test-only: the lint wall crate names `socket2::Socket` so the wall entry for it can fire (M1-044). The
# version is the one tokio uses. cargo deny keeps it out of every check crate (deny.toml).
socket2 = { version = "0.6", default-features = false }

# Test-only: the allow grep of the lint wall parses every source file (M1-044). Both are already in the tree
# through the derive crates.
syn = { version = "2", default-features = false }
proc-macro2 = { version = "1", default-features = false }

# Test-only: the lint wall tests read manifests and Cargo configs as TOML (M1-044). Already in the tree.
toml = { version = "1", default-features = false }

# The redacting log writer (M1-056, ADR 0015 decision 5). No ANSI colour: colour codes between a field
# name and `=` would hide `password=hunter2` from the key-name rule (04 section 3.4).
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3.20", default-features = false }
# Test-only: a `log` record to prove the tracing capture also sees the `log` crate (M1-102).
log = { version = "0.4", default-features = false }
# The key derivation of a secret key file (ADR 0022) takes a second or so with optimizations. An
# unoptimized debug build would take minutes, so these crates are optimized in every profile.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3

# The cut-buffer tests (M1-061) redact 1 MiB buffers at 64 offsets for four caps. Unoptimized, the
# redactor and the regex engine under it took about a minute for that one test binary. With these
# overrides it takes about 4 seconds. They apply to every dev and test build of the workspace.
[profile.dev.package.regex-automata]
opt-level = 2
[profile.dev.package.regex-syntax]
opt-level = 2
[profile.dev.package.regex]
opt-level = 2
[profile.dev.package.memchr]
opt-level = 2
[profile.dev.package.rdy-engine]
opt-level = 2

# The profile `dist` builds release archives with (dist-workspace.toml). Keep unwinding: the
# scheduler isolates a panicking check with catch_unwind (docs/plan/02-engine-design.md). Symbols
# are stripped. The cargo-auditable data stays: scripts/check-release-artifacts.sh proves it.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
