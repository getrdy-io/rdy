[workspace]
resolver = "3"
members = [
    "crates/rdy-spec",
    "crates/rdy-engine",
    "crates/rdy-checks-host",
    "crates/rdy-checks-net",
    "crates/rdy-checks-k8s",
    "crates/rdy-cli",
    "crates/xtask",
]

# Crates enter the workspace when their milestone starts (docs/plan/00-overview.md).
# rdy-bundle is M2, rdy-checks-cloud is M3, rdy-checks-gpu is M4.
# xtask is the repo task runner (cargo xtask). It is never published.

[workspace.package]
edition = "2024"
# Stable minus two minors (docs/plan/06-release-and-distribution.md). A CI job enforces it from M2.
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/getrdy-io/rdy"
homepage = "https://getrdy.io"
# There is no shared `version`. Versions are per crate (ADR 0007).

[workspace.dependencies]
# Each ticket adds the lines it needs. Nothing is listed ahead of use.
# Default features are off. The crate that uses a dependency names its features.
anyhow = { version = "1", default-features = false }
clap = { version = "4.6", default-features = false }
jsonschema = { version = "0.60", default-features = false }
serde = { version = "1", default-features = false }
serde-saphyr = { version = "~2.0", default-features = false }
serde_json = { version = "1", default-features = false }
trybuild = "1"
thiserror = { version = "2", default-features = false }
# HMAC-SHA256 tags and the per-run key for the redactor (ADR 0009, ADR 0015). No aws-lc.
ring = { version = "0.17", default-features = false }
# Linear-time matching for the redaction rules (04 section 3.4).
regex = { version = "1", default-features = false }
# The scheduler (M1-034). Each crate names the features it uses.
tokio = { version = "1", default-features = false }
rpassword = { version = "7.5", default-features = false }
# Pseudo-terminal driver for the prompt tests (M1-123). Test-only, Unix only.
rexpect = { version = "0.7", default-features = false }
sha2 = { version = "0.10", default-features = false }
tempfile = { version = "3", default-features = false }
unicode-normalization = { version = "0.1", default-features = false }
# Safe wrappers over open flags and geteuid, so the password file checks need no unsafe (M1-112).
rustix = { version = "1", default-features = false }
# Key passwords are wiped from memory on drop (M1-112). `alloc` gives the String impl.
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# Spec signature checks (M1-120, ADR 0018). Exact pins: every bump is reviewed by hand.
ed25519-dalek = { version = "=2.2.0", default-features = false }
blake2 = { version = "=0.10.6", default-features = false }
# Test-only: signs synthetic specs the way stock minisign does, and generates property-test cases.
minisign = { version = "=0.10.0", default-features = false }
proptest = { version = "1", default-features = false }

# The profile `dist` builds release archives with (dist-workspace.toml). Keep unwinding: the
# scheduler isolates a panicking check with catch_unwind (docs/plan/02-engine-design.md). Symbols
# are stripped. The cargo-auditable data stays: scripts/check-release-artifacts.sh proves it.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
